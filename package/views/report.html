<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data: blob:; media-src data: blob:; form-action 'none'; base-uri 'none'">
<title>Inspection report</title>
<!--
  Inspect's view of its report (Common Agent Specification 6.13.6; the
  Descriptor to user interface binding, Section 9). It draws one output, the
  inspection report, from the bytes the host hands it in view/data, and from
  nothing else: it loads nothing, opens nothing and acts on nothing. It asks
  the host for three things only: a height (view/resize), words copied to the
  clipboard (view/copy-text) and a file saved (view/save-file).

  It draws the delivered report, and the working copy the job posts while it
  runs (the same format, with "partial"), so a person sees the findings so
  far and the stage the job is at. Colors and fonts come from the host's
  --ca-* tokens, each with a fallback for light and for dark. A level is
  always a word and a shape, never a color alone.

  Since 0.2.3 the report is five tabs under its head: Overview (sections 1
  and 2), What it does (3 and 4), What it reaches (5 and 6), Risks (7) and
  Tests and gaps (8). Each tab's label counts its findings, and Risks names
  its highest level. The view starts on Overview, since the frame keeps
  nothing between visits, and only the person moves it to another tab.
-->
<style>
:root {
  --fb-background: #ffffff; --fb-surface: #f5f6f8; --fb-text: #1c1f24; --fb-muted: #5d6471;
  --fb-accent: #2f5bd3; --fb-border: #d8dce2; --fb-danger: #b3261e;
  --bg: var(--ca-color-background, var(--fb-background));
  --surface: var(--ca-color-surface, var(--fb-surface));
  --text: var(--ca-color-text, var(--fb-text));
  --muted: var(--ca-color-text-muted, var(--fb-muted));
  --accent: var(--ca-color-accent, var(--fb-accent));
  --border: var(--ca-color-border, var(--fb-border));
  --danger: var(--ca-color-danger, var(--fb-danger));
  --body: var(--ca-font-body, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif);
  --mono: var(--ca-font-mono, ui-monospace, "SFMono-Regular", "Cascadia Mono", Consolas, "Liberation Mono", monospace);
  --size: var(--ca-font-size, 15px);
  --radius: var(--ca-radius, 8px);
  --s: var(--ca-space, 8px);
  color-scheme: light;
}
:root[data-scheme="dark"] {
  --fb-background: #16181c; --fb-surface: #1f2228; --fb-text: #e7e9ec; --fb-muted: #a0a7b3;
  --fb-accent: #8fb0ff; --fb-border: #353a43; --fb-danger: #ff8f86;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-scheme="light"]) {
    --fb-background: #16181c; --fb-surface: #1f2228; --fb-text: #e7e9ec; --fb-muted: #a0a7b3;
    --fb-accent: #8fb0ff; --fb-border: #353a43; --fb-danger: #ff8f86;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); font-size: var(--size); line-height: 1.5; }
body { padding: calc(var(--s) * 2.5) calc(var(--s) * 2); }
#app { min-width: 0; }
h1, h2, h3, p { margin: 0; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 0.88em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* The head */
.head { display: flex; gap: calc(var(--s) * 2); align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.eyebrow { font-size: 0.8em; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-size: 1.55em; line-height: 1.2; font-weight: 650; margin-top: calc(var(--s) * 0.5); overflow-wrap: anywhere; }
.meta { margin-top: calc(var(--s) * 0.75); font-size: 0.9em; color: var(--muted); }
.meta span + span::before { content: "\00B7"; padding: 0 0.45em; }
.btn { border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius); padding: calc(var(--s) * 0.75) calc(var(--s) * 1.5); font-size: 0.9em; font-weight: 550; display: inline-flex; gap: 0.5em; align-items: center; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn[disabled] { opacity: 0.55; cursor: default; }

/* Where the report is in its life */
.track { list-style: none; padding: 0; margin: calc(var(--s) * 2) 0 0; display: flex; flex-wrap: wrap; gap: calc(var(--s) * 0.5) 0; font-size: 0.88em; }
.track li { display: inline-flex; align-items: center; gap: 0.45em; color: var(--muted); }
.track li + li::before { content: ""; width: calc(var(--s) * 3); height: 1px; background: var(--border); margin: 0 0.6em; }
.track li[aria-current="step"] { color: var(--text); font-weight: 650; }
.track li.done { color: var(--text); }
.track svg { flex: none; }
.now { margin-top: calc(var(--s) * 1); font-size: 0.92em; display: flex; gap: 0.55em; align-items: baseline; }
.pulse { display: inline-block; width: 0.55em; height: 0.55em; border-radius: 50%; background: var(--accent); flex: none; transform: translateY(-0.05em); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.3; } }
@media (prefers-reduced-motion: reduce) { .pulse, .tab .live { animation: none; } }
.stopped.notice { border-color: var(--border); background: var(--surface); }
.stopped { margin-top: calc(var(--s) * 1.5); border: 1px solid var(--danger); border-radius: var(--radius); padding: calc(var(--s) * 1) calc(var(--s) * 1.5); display: flex; gap: 0.6em; align-items: flex-start; }
.note { margin-top: calc(var(--s) * 1); font-size: 0.86em; color: var(--muted); }

/* The tabs: an index of the report. Each tab names the sections it holds by
   the prefix their findings carry (S7 for S7-010), then its name, then how
   many findings it holds. The tab the person is on is raised and underlined;
   a tab still filling has a dotted rule under it, never a color alone. */
.tabs-wrap { margin-top: calc(var(--s) * 2.25); border-bottom: 1px solid var(--border); min-width: 0; }
.tabs { position: relative; display: flex; gap: calc(var(--s) * 0.35); overflow-x: auto; overflow-y: hidden; scrollbar-width: none; overscroll-behavior-x: contain; margin-bottom: -1px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs.more-right { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 3.5em), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 3.5em), transparent); }
.tabs.more-left { -webkit-mask-image: linear-gradient(to right, transparent, #000 3.5em); mask-image: linear-gradient(to right, transparent, #000 3.5em); }
.tabs.more-left.more-right { -webkit-mask-image: linear-gradient(to right, transparent, #000 3.5em, #000 calc(100% - 3.5em), transparent); mask-image: linear-gradient(to right, transparent, #000 3.5em, #000 calc(100% - 3.5em), transparent); }
.tab { all: unset; box-sizing: border-box; flex: none; cursor: pointer; display: grid; align-content: start; gap: calc(var(--s) * 0.15); min-width: 7.2em; padding: calc(var(--s) * 0.9) calc(var(--s) * 1.35) calc(var(--s) * 0.85); border: 1px solid transparent; border-bottom: 0; border-radius: calc(var(--radius) * 0.75) calc(var(--radius) * 0.75) 0 0; color: var(--muted); position: relative; }
.tab::after { content: ""; position: absolute; left: calc(var(--s) * 0.6); right: calc(var(--s) * 0.6); bottom: 0; border-bottom: 3px solid transparent; }
.tab:hover { color: var(--text); }
.tab:hover::after { border-bottom-color: var(--border); }
.tab[aria-selected="true"] { color: var(--text); background: var(--surface); border-color: var(--border); }
.tab[aria-selected="true"]::after { left: -1px; right: -1px; border-bottom-color: var(--accent); }
.tab:not([aria-selected="true"]).tab-filling::after, .tab:not([aria-selected="true"]).tab-waiting::after { border-bottom: 2px dotted var(--muted); opacity: 0.7; }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
.tab-key { font-family: var(--mono); font-size: 0.68em; letter-spacing: 0.04em; color: var(--muted); white-space: nowrap; }
.tab-name { font-size: 0.86em; font-weight: 600; white-space: nowrap; }
.tab[aria-selected="true"] .tab-name { font-weight: 700; }
.tab-sub { display: flex; align-items: center; gap: 0.5em; white-space: nowrap; min-height: 1.7em; }
.tab-n { font-size: 1.32em; font-weight: 650; line-height: 1.2; font-variant-numeric: tabular-nums; color: var(--text); letter-spacing: -0.01em; }
.tab:not([aria-selected="true"]) .tab-n { font-weight: 560; }
.tab-n.wait { color: var(--muted); font-weight: 500; letter-spacing: 0.08em; }
.tab .sep { color: var(--muted); }
.tab .lv { font-size: 0.8em; }
.tab .live { width: 0.5em; height: 0.5em; border-radius: 50%; background: var(--accent); flex: none; animation: live 1.6s ease-in-out infinite; }
@keyframes live { 50% { opacity: 0.55; } }

/* A tab's panel */
.panel { padding-top: calc(var(--s) * 2.5); }
.panel:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 4px; }
.panel > :first-child { margin-top: 0; }

/* At a glance */
.glance { margin-top: calc(var(--s) * 3); background: var(--surface); border: 1px solid var(--border); border-radius: calc(var(--radius) * 1.25); padding: calc(var(--s) * 2.25); }
.glance-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.25em 0.75em; }
.glance h2 { font-size: 1.1em; font-weight: 650; }
.glance-h .count { font-size: 0.86em; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: calc(var(--s) * 1); margin-top: calc(var(--s) * 1.5); }
.tile { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: calc(var(--s) * 1.25) calc(var(--s) * 1.5); }
.tile .n { font-size: 1.6em; font-weight: 650; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .w { display: flex; gap: 0.4em; align-items: center; font-size: 0.86em; margin-top: 0.25em; }
.tile.zero .n, .tile.zero .w, .tile.zero .lv { color: var(--muted); font-weight: 500; }
.matters { list-style: none; margin: calc(var(--s) * 2) 0 0; padding: 0; display: grid; gap: calc(var(--s) * 1.5); }
.matters li { display: grid; grid-template-columns: 6.6em minmax(0, 1fr); gap: calc(var(--s) * 1.25); }
.matters .t { font-weight: 620; }
.matters .says { color: var(--text); margin-top: 0.15em; }
.matters .see { margin-top: 0.3em; font-size: 0.86em; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.lead { margin-top: calc(var(--s) * 1.5); font-size: 0.9em; color: var(--muted); }

/* For security, on Overview */
.forsec { margin-top: calc(var(--s) * 3); display: flex; gap: calc(var(--s) * 1.5) calc(var(--s) * 2.5); align-items: center; justify-content: space-between; flex-wrap: wrap; border: 1px solid var(--border); border-radius: calc(var(--radius) * 1.25); padding: calc(var(--s) * 1.75) calc(var(--s) * 2); }
.forsec > div { flex: 1 1 18em; min-width: 0; }
.forsec h2 { font-size: 1em; font-weight: 650; }
.forsec p { font-size: 0.88em; color: var(--muted); margin-top: 0.2em; max-width: 52ch; }

/* Levels: a shape and a word */
.lv { display: inline-flex; align-items: center; gap: 0.4em; font-size: 0.86em; font-weight: 600; white-space: nowrap; }
.lv svg { flex: none; }
.lv.critical, .lv.high { color: var(--danger); }
.lv.medium { color: var(--text); }
.lv.low, .lv.none { color: var(--muted); }
.lv .word { color: var(--text); }
.lv.unrated { color: var(--muted); font-weight: 500; }
.lv.unrated .word { color: var(--muted); }

/* The level filter, on Risks */
.filters { margin-top: 0; display: flex; flex-wrap: wrap; gap: calc(var(--s) * 1.25) calc(var(--s) * 2.5); align-items: center; padding-bottom: calc(var(--s) * 1.5); border-bottom: 1px solid var(--border); }
.chips { display: inline-flex; flex-wrap: wrap; gap: calc(var(--s) * 0.5); align-items: center; }
.chips .lbl { font-size: 0.9em; margin-right: 0.2em; }
.chip { border: 1px solid var(--border); background: var(--bg); border-radius: 999px; padding: 0.2em 0.75em; font-size: 0.85em; display: inline-flex; gap: 0.4em; align-items: center; }
.chip[aria-pressed="true"] { border-color: var(--text); background: var(--surface); font-weight: 650; box-shadow: inset 0 0 0 1px var(--text); }
.chip .c { color: var(--muted); font-variant-numeric: tabular-nums; }
.showing { font-size: 0.86em; color: var(--muted); width: 100%; margin: calc(var(--s) * -0.25) 0 0; }

/* The sections */
section.sec { margin-top: calc(var(--s) * 3); }
.sec-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 0.75em; padding-bottom: calc(var(--s) * 0.75); }
.sec-h .num { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; min-width: 1.2em; }
.sec-h h2 { font-size: 1.05em; font-weight: 650; }
.sec-h .count { font-size: 0.86em; color: var(--muted); white-space: nowrap; }
.rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border); }
.row { border-bottom: 1px solid var(--border); }
/* A row: the level, then the whole title with the file and line under it,
   then the category. The title wraps; it is never cut. */
.line { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; }
.toggle { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 6.6em minmax(0, 1fr) auto; grid-template-areas: "lv t cat"; gap: calc(var(--s) * 0.5) calc(var(--s) * 1.25); align-items: baseline; padding: calc(var(--s) * 0.9) calc(var(--s) * 0.75); min-width: 0; border-radius: 4px; }
.toggle:hover { background: var(--surface); }
.toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.toggle > .lv { grid-area: lv; }
.toggle > .t { grid-area: t; min-width: 0; display: grid; gap: 0.2em; }
.toggle > .cat { grid-area: cat; justify-self: end; }
.toggle .tt { overflow-wrap: anywhere; padding-left: 0.9em; text-indent: -0.9em; }
.toggle .tt .chev { display: inline-block; width: 0.9em; text-indent: 0; color: var(--muted); }
.cat { font-family: var(--mono); font-size: 0.8em; border: 1px solid var(--border); border-radius: 4px; padding: 0.05em 0.4em; white-space: nowrap; color: var(--text); display: inline-flex; max-width: 24ch; min-width: 0; }
.cat .id { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.cat .n-more { flex: none; color: var(--muted); }
.place { font-family: var(--mono); font-size: 0.82em; color: var(--muted); overflow-wrap: anywhere; padding-left: calc(0.9em / 0.82); }
.place.src { font-family: var(--body); font-size: 0.86em; padding-left: calc(0.9em / 0.86); }
.copy { border: 0; background: none; color: var(--muted); font-size: 0.85em; padding: calc(var(--s) * 0.95) calc(var(--s) * 1); border-radius: 4px; white-space: nowrap; }
.row:hover .copy, .copy:focus-visible { color: var(--accent); }
.copy:hover { text-decoration: underline; text-underline-offset: 2px; }
.rows.unrated .toggle { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "t cat"; }
.detail { padding: 0 calc(var(--s) * 1) calc(var(--s) * 1.75) calc(var(--s) * 0.75 + 6.6em + var(--s) * 1.25); display: grid; gap: calc(var(--s) * 1); font-size: 0.93em; }
.rows.unrated .detail { padding-left: calc(var(--s) * 2.2); }
.detail dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: calc(var(--s) * 0.5) calc(var(--s) * 1.5); margin: 0; font-size: 0.92em; }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; min-width: 0; }
.detail ul { margin: 0; padding: 0; list-style: none; display: grid; gap: calc(var(--s) * 0.5); }
.detail code { font-family: var(--mono); font-size: 0.86em; display: block; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); }
.more { margin: calc(var(--s) * 1) 0 0 calc(var(--s) * 0.75); }
.empty { padding: calc(var(--s) * 1.25) calc(var(--s) * 0.75); color: var(--muted); font-size: 0.92em; border-bottom: 1px solid var(--border); }
.coming { display: flex; gap: 0.6em; align-items: baseline; padding: calc(var(--s) * 1) calc(var(--s) * 0.75); color: var(--muted); font-size: 0.9em; border-bottom: 1px solid var(--border); }

/* A tab whose sections have not arrived yet */
.waitcard { border: 1px dashed var(--border); border-radius: calc(var(--radius) * 1.25); padding: calc(var(--s) * 2) calc(var(--s) * 2.25); }
.waitcard .msg { display: flex; gap: 0.75em; align-items: baseline; }
.waitcard .msg strong { font-weight: 650; }
.waitcard .msg p { margin-top: 0.2em; font-size: 0.92em; }
.waitcard ul { list-style: none; margin: calc(var(--s) * 1.75) 0 0; padding: 0; border-top: 1px solid var(--border); }
.waitcard li { display: grid; grid-template-columns: 1.6em minmax(0, 1fr) auto; gap: calc(var(--s) * 1); align-items: baseline; padding: calc(var(--s) * 0.9) 0; border-bottom: 1px solid var(--border); }
.waitcard li:last-child { border-bottom: 0; }
.waitcard .num { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.waitcard .st { display: inline-flex; gap: 0.4em; align-items: center; color: var(--muted); font-size: 0.86em; white-space: nowrap; }

.held { margin-top: calc(var(--s) * 3); font-size: 0.92em; }
.held h2 { font-size: 1.05em; font-weight: 650; margin-bottom: calc(var(--s) * 1); }
.held ul { margin: 0; padding-left: 1.2em; display: grid; gap: calc(var(--s) * 0.5); }
.foot { margin-top: calc(var(--s) * 3); font-size: 0.86em; color: var(--muted); }
.waiting { padding: calc(var(--s) * 4) 0; color: var(--muted); }
.toast { position: fixed; right: calc(var(--s) * 2); bottom: calc(var(--s) * 2); background: var(--text); color: var(--bg); border-radius: var(--radius); padding: calc(var(--s) * 0.75) calc(var(--s) * 1.5); font-size: 0.88em; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
.toast.on { opacity: 1; }

@media (max-width: 640px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .toggle { grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "lv cat" "t t"; align-items: center; }
  .toggle > .cat { justify-self: start; }
  .rows.unrated .toggle { grid-template-columns: minmax(0, 1fr); grid-template-areas: "t" "cat"; }
  .detail { padding-left: calc(var(--s) * 0.75); }
  .matters li { grid-template-columns: 1fr; gap: calc(var(--s) * 0.5); }
  .track li + li::before { display: none; }
  .track { gap: calc(var(--s) * 0.75) calc(var(--s) * 2); }
  .tab { min-width: 6.4em; padding: calc(var(--s) * 0.75) calc(var(--s) * 1.1) calc(var(--s) * 0.75); }
  .forsec { padding: calc(var(--s) * 1.5); }
  .waitcard { padding: calc(var(--s) * 1.5); }
}
</style>
</head>
<body>
<main id="app"><p class="waiting">Waiting for the report.</p></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
(() => {
  // The bridge (DESCRIPTOR-UI Section 9.4): JSON-RPC 2.0 messages with the
  // host, the page above this frame. Only the methods below, and only the
  // requests this view declares.
  const REQUESTS = ["resize", "copy-text", "save-file"];
  const TOKENS = ["--ca-color-background", "--ca-color-surface", "--ca-color-text", "--ca-color-text-muted", "--ca-color-accent", "--ca-color-border", "--ca-color-danger", "--ca-font-body", "--ca-font-mono", "--ca-font-size", "--ca-radius", "--ca-space"];
  const KIND = "application/vnd.agentmesh.inspection-report+json";
  const LEVELS = ["critical", "high", "medium", "low", "none"];
  const LEVEL_WORD = { critical: "Critical", high: "High", medium: "Medium", low: "Low", none: "No risk" };
  // A finding the report gives no level: said in words and with a shape of
  // its own, like every level, so it never reads as an empty column.
  const NOT_RATED = "Not rated";
  const SYSTEM_WORD = { "code-host": "GitHub's records", "vulnerability-database": "OSV, the vulnerability database", "text-reasoning": "the model" };
  const FOLD_AT = 12;
  // The five tabs, each holding whole sections, in the report's own order.
  const TABS = [
    { id: "overview", name: "Overview", sections: [1, 2] },
    { id: "does", name: "What it does", sections: [3, 4] },
    { id: "reaches", name: "What it reaches", sections: [5, 6] },
    { id: "risks", name: "Risks", sections: [7] },
    { id: "tests", name: "Tests and gaps", sections: [8] },
  ];
  const RISKS = 7;
  // How a job's findings arrive: the scripts' findings all at once (section
  // 2 among them), then the model's judgments of sections 3 to 5 in one
  // call, of 6 to 8 in the next, and section 1 last.
  const CALLS = [[3, 4, 5], [6, 7, 8]];

  const root = document.documentElement;
  const app = document.getElementById("app");
  const state = { initialized: false, ready: false, locale: undefined, doc: null, params: null, tab: TABS[0].id, level: "all", open: new Set(), unfolded: new Set() };

          key !== "all" ? el("span", { class: `lv ${key}` }, shape(key, 11)) : null, el("span", { text: word }), el("span", { class: "c", text: String(count) })))),
      el("p", { class: "showing", "aria-live": "polite", text: `Showing ${shown} of the ${plural(pool.length, "finding")} in section 7${more > 0 ? `; ${more} more ${more === 1 ? "arrives" : "arrive"} with the report` : ""}` }));
  }

  function copyText(d, f) {
    const l = levelOf(f);
    const lines = [`${f.id}${l ? `, ${LEVEL_WORD[l].toLowerCase()}${l === "none" ? "" : " risk"}` : ""}: ${f.title}`];
    if (f.says) lines.push(f.says);
    const cats = (f.categories ?? []).map((c) => (c.name && c.name !== c.id ? `${c.id} ${c.name}` : c.id)).filter(Boolean);
    if (cats.length) lines.push(`Category: ${cats.join("; ")}`);
    for (const e of (f.evidence ?? []).slice(0, 10)) { const a = address(d, e.file, e.line); lines.push(`${e.file} line ${e.line}${a ? `: ${a}` : ""}`); }
    const more = Math.max(0, (f.evidence?.length ?? 0) - 10) + (Number(f.more_evidence) || 0);
    if (more) lines.push(`And ${plural(more, "more place")} in the report.`);
    if (!f.evidence?.length && f.source?.length) lines.push(`From ${f.source.map((s) => `${SYSTEM_WORD[s.system] ?? s.system}, ${s.call}`).join("; ")}.`);
    lines.push(`From Inspect's report on ${repoName(d)} at commit ${short(d.commit?.sha)}.`);
    return lines.join("\n");
  }
  async function doCopy(d, f) {
    const r = await ask("view/copy-text", { text: copyText(d, f) });
    toast(r && !r.error ? `Copied ${f.id}.` : `${f.id} was not copied.`);
  }
  let toastTimer;
  function toast(words) {
    const t = document.getElementById("toast");
    t.textContent = words; t.classList.add("on");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 2200);
  }

  function drawRow(d, f, rated) {
    const open = state.open.has(f.id);
    const cat = (f.categories ?? [])[0];
    const detailId = `d-${f.id}`;
    const place = placeOf(f);
    const row = el("li", { class: "row", id: `f-${f.id}` },
      el("div", { class: "line" },
        el("button", { class: "toggle", type: "button", "aria-expanded": open ? "true" : "false", "aria-controls": detailId, "data-k": `row:${f.id}`, onclick: () => { if (state.open.has(f.id)) state.open.delete(f.id); else state.open.add(f.id); draw(); } },
          rated ? badge(f) : null,
          el("span", { class: "t" },
            el("span", { class: "tt" }, el("span", { class: "chev", "aria-hidden": "true", text: open ? "▾" : "▸" }), f.title),
            place.text ? el("span", { class: place.src ? "place src" : "place", title: place.full || null }, breakable(place.text)) : null),
          cat ? el("span", { class: "cat", title: cat.name || cat.id }, el("span", { class: "id", text: cat.id }),
            f.categories.length > 1 ? el("span", { class: "n-more", text: ` +${f.categories.length - 1}` }) : null) : null),
        el("button", { class: "copy", type: "button", "aria-label": `Copy ${f.id} with its address`, "data-k": `copy:${f.id}`, onclick: () => doCopy(d, f), text: "Copy" })));
    if (open) row.append(drawDetail(d, f, detailId));
    return row;
  }
  function drawDetail(d, f, id) {
    const ev = Array.isArray(f.evidence) ? f.evidence : [];
    const dl = el("dl", {});
    const add = (k, v) => { if (v) dl.append(el("dt", { text: k }), el("dd", {}, v)); };
    if (f.categories?.length) add(f.categories.length === 1 ? "Category" : "Categories", f.categories.map((c) => `${c.id}${c.name && c.name !== c.id ? ` ${c.name}` : ""}`).join("; "));
    const l = levelOf(f);
    if (l) add("Level", `${LEVEL_WORD[l]}, ${f.level_by === "source" ? "as its record gives it" : f.level_by === "rule" ? "by a fixed rule of Inspect's" : f.level_by === "model" ? "as the model judged it" : "set by Inspect"}`);
    add("Written", f.by === "model" ? "by the model, from facts the scripts found" : "by Inspect's scripts, by rule");
    if (ev.length) {
      const more = Number(f.more_evidence) || 0;
      add("Cites", el("ul", {}, ev.map((e) => el("li", {}, el("span", { class: "mono", text: `${e.file}:${e.line}` }), e.text ? el("code", { text: String(e.text).slice(0, 300) }) : null)),
        more ? el("li", { class: "muted", text: `And ${plural(more, "more place")}, in the delivered report.` }) : null));
    } else if (f.source?.length) {
      add("From", f.source.map((s) => `${SYSTEM_WORD[s.system] ?? s.system}: ${s.call}`).join("; "));
    }
    return el("div", { class: "detail", id },
      f.says ? el("p", { text: f.says }) : el("p", { class: "muted", text: "Its words arrive with the delivered report." }),
      dl);
  }

  // A section's rows in the order drawn: the highest level first, else the
  // report's order; on Risks, only the level the filter keeps.
  function rowsOf(d, s) {
    const level = s === RISKS ? state.level : "all";
    return ofSection(d, s).map((f, i) => [f, i]).filter(([f]) => keeps(f, level)).sort((a, b) => rank(a[0]) - rank(b[0]) || a[1] - b[1]).map(([f]) => f);
  }
  function drawSection(d, p, s, pending) {
    const all = ofSection(d, s);
    const list = rowsOf(d, s);
    const filtered = s === RISKS && state.level !== "all";
    const coming = pending.has(s);
    const n = sectionCount(d, s);
    const missing = n - all.length;
    const folded = list.length > FOLD_AT && !state.unfolded.has(s);
    const visible = folded ? list.slice(0, FOLD_AT) : list;
    const rated = all.some((f) => levelOf(f));
    const count = filtered ? `${list.length} of ${all.length}` : !n && coming ? "none yet" : `${plural(n, "finding")}${coming ? " so far" : ""}`;
    const head = el("div", { class: "sec-h" }, el("span", { class: "num", text: String(s) }), el("h2", { id: `s-${s}`, text: titleOf(d, s) }), el("span", { class: "count", text: count }));
    const body = !list.length && missing > 0 && !filtered ? null : list.length
      ? el("ul", { class: rated ? "rows" : "rows unrated", "aria-labelledby": `s-${s}` }, visible.map((f) => drawRow(d, f, rated)))
      : el("p", { class: "empty", text: filtered ? "No finding of this level in this section." : coming ? "Nothing yet. This section fills in while Inspect runs." : d.partial && !running(p, d) ? "Nothing was posted for this section before the job ended." : "Nothing was found for this section." });
    const notes = [];
    if (missing > 0 && !filtered) notes.push(el("p", { class: "coming", text: `${plural(missing, "more finding")} without a level ${missing === 1 ? "is" : "are"} not in this copy yet; ${missing === 1 ? "it arrives" : "they arrive"} with the report.` }));
    if (coming && list.length) notes.push(el("p", { class: "coming" }, el("span", { class: "pulse", "aria-hidden": "true" }), el("span", { text: "More findings for this section arrive once the model has judged it." })));
    return { node: el("section", { class: "sec" }, head, body, notes,
      folded ? el("button", { class: "btn more", type: "button", "data-k": `more:${s}`, onclick: () => { state.unfolded.add(s); draw(); }, text: `Show all ${list.length}` }) : null), shown: list.length };
  }
  // A tab none of whose sections has arrived: it says so, and names them.
  function drawWaiting(d, t) {
    return el("div", { class: "waitcard" },
      el("div", { class: "msg" }, el("span", { class: "pulse", "aria-hidden": "true" }),
        el("div", {}, el("strong", { text: "Nothing here yet." }),
          el("p", { class: "muted", text: "Inspect posts these sections as it reads the code. This tab fills in by itself; you can read the others in the meantime." }))),
      el("ul", { "aria-label": "Still to come" }, t.sections.map((s) => el("li", {}, el("span", { class: "num", text: String(s) }), el("span", { text: titleOf(d, s) }),
        el("span", { class: "st" }, shape("todo", 12), el("span", { text: "Waiting" }))))));
  }
  function drawForSecurity(d) {
    return el("section", { class: "forsec", "aria-labelledby": "forsec-h" },
      el("div", {}, el("h2", { id: "forsec-h", text: "For your security team" }),
        el("p", { text: "One plain-text file: the risks, highest first, the credentials it reads, what it can do on its own and what Inspect couldn't tell, each with its file and line." })),
      el("button", { class: "btn", type: "button", "data-k": "save", onclick: () => doSave(d), text: "Save a summary for security" }));
  }
  function drawPanel(d, p, t, pending) {
    const out = [];
    if (t.id === "overview") {
      out.push(drawGlance(d, p), drawSection(d, p, 2, pending).node, drawForSecurity(d));
    } else if (tabStatus(d, t, pending).waiting) {
      out.push(drawWaiting(d, t));
    } else {
      const drawn = t.sections.map((s) => drawSection(d, p, s, pending));
      if (t.sections.includes(RISKS) && ofSection(d, RISKS).length) out.push(drawLevelFilter(d, drawn[t.sections.indexOf(RISKS)].shown));
      out.push(...drawn.map((x) => x.node));
    }
    const held = (Array.isArray(d.held_back) ? d.held_back : []).filter((h) => t.sections.includes(Number(h.section)));
    if (held.length) {
      out.push(el("section", { class: "held" }, el("h2", { text: `${plural(held.length, "judgment")} held back` }),
        el("ul", {}, held.map((h) => el("li", { text: `Section ${h.section}, ${h.title}: ${h.why}` })))));
    }
    return out;
  }

  function focusKey() {
    for (let n = document.activeElement; n && n !== document.body && typeof n.getAttribute === "function"; n = n.parentNode) {
      const k = n.getAttribute("data-k");
      if (k) return k;
    }
    return null;
  }

  function draw() {
    const d = state.doc;
    if (!state.initialized && !d) return;
    const keep = window.scrollY;
    const focused = focusKey();
    const stripLeft = Number(app.querySelector(".tabs")?.scrollLeft) || 0;
    keyed = new Map();
    app.replaceChildren();
    if (!d) { app.append(el("p", { class: "waiting", text: "Waiting for the report." })); resize(); return; }
    const p = state.params ?? {};
    const live = running(p, d);
    const pending = pendingOf(d, p);
    const meta = el("p", { class: "meta" },
      el("span", { text: `Commit ${short(d.commit?.sha)}` }),
      d.commit?.date && dateOf(d.commit.date) ? el("span", { text: `committed ${dateOf(d.commit.date)}` }) : null,
      dateOf(d.inspected_at) ? el("span", { text: `${d.partial ? "inspection started" : "inspected"} ${dateOf(d.inspected_at)}` }) : null,
      el("span", { class: "tally", text: tallyWords(d, live) }));
    app.append(el("header", {},
      el("div", { class: "head" },
        el("div", {}, el("p", { class: "eyebrow", text: live ? "Inspection report, so far" : d.partial ? "Inspection report, as posted while it ran" : "Inspection report" }), el("h1", { text: repoName(d) }), meta)),
      drawLife(d, p)));
    const tabs = drawTabs(d, pending);
    app.append(tabs);
    app.append(...TABS.map((t) => {
      const on = state.tab === t.id;
      return el("div", { class: "panel", role: "tabpanel", id: `panel-${t.id}`, "aria-labelledby": `tab-${t.id}`, tabindex: "0", hidden: !on, "data-k": `panel:${t.id}` }, on ? drawPanel(d, p, t, pending) : null);
    }));
    app.append(el("p", { class: "foot", text: "Inspect read this code without running any of it. It gives no verdict on bringing the agent in; that decision is yours." }));
    const strip = app.querySelector(".tabs");
    if (strip) { strip.scrollLeft = stripLeft; edges(strip); }
    if (focused && keyed.has(focused)) keyed.get(focused).focus({ preventScroll: true });
    window.scrollTo(0, keep);
    resize();
  }

  // "See S7-010": the tab that holds the finding, then the finding itself,
  // in sight and open, once the frame has been made to fit the tab.
  async function reveal(id) {
    const d = state.doc;
    const f = d?.findings.find((x) => x.id === id);
    if (!f) return;
    if (f.section === RISKS && !keeps(f, state.level)) state.level = "all";
    state.open.add(id);
    if (rowsOf(d, f.section).indexOf(f) >= FOLD_AT) state.unfolded.add(f.section);
    const fitted = setTab(tabOf(f.section).id);
    await Promise.race([fitted, new Promise((r) => setTimeout(r, 600))]);
    const row = document.getElementById(`f-${id}`);
    if (row) { row.scrollIntoView({ block: "center" }); row.querySelector(".toggle")?.focus({ preventScroll: true }); }
  }

  // The summary for security, as plain text: the risks highest first, the
  // credentials it reads, what it can do on its own and what Inspect could
  // not tell, each with its file and line and the address of that line.
  const one = (s) => String(s ?? "").replace(/\s+/g, " ").trim();
  function summary(d) {
    const c = counts(d); const p = state.params ?? {}; const at = lifecycle(d, p);
    const findings = d.findings.filter((f) => f.section !== 1);
    const risks = findings.filter((f) => levelOf(f) && levelOf(f) !== "none").sort((a, b) => rank(a) - rank(b));
    const places = (f, indent) => (f.evidence ?? []).slice(0, 3).map((e) => { const a = address(d, e.file, e.line); return `${indent}${one(e.file)} line ${e.line}${a ? `: ${a}` : ""}`; });
    const cat = (f) => (f.categories ?? []).map((x) => one(x.name && x.name !== x.id ? `${x.id} ${x.name}` : x.id)).join("; ");
    const where = at.stopped ? "The job stopped before the report was finished; this summary is of the findings it made."
      : at.short ? "The job finished, but the full report did not arrive; this summary is of the findings it posted while it ran."
      : at.step === 0 ? `The job is still running (${one(d.partial?.stage)}); this summary is of the findings so far.`
      : at.step === 1 ? "Delivered, and waiting for review." : at.step === 2 ? "Delivered and accepted." : at.step === 3 ? "Delivered, accepted and published." : "Delivered.";
    const lines = [
      `Security summary: ${repoName(d)} at commit ${short(d.commit?.sha)}`, "",
      `Inspect read the code of ${repoName(d)} at commit ${d.commit?.sha} without running any of it. It gives no verdict on bringing the agent in.`,
      `Repository: ${one(d.repository?.url)}`, `Report: ${where}`, "",
      "Risks by level", "",
      `${c.critical ?? 0} critical, ${c.high ?? 0} high, ${c.medium ?? 0} medium and ${c.low ?? 0} low.`, "",
      "Risks, highest first", "",
    ];
    if (!risks.length) lines.push("No risk was rated.", "");
    risks.forEach((f, i) => {
      lines.push(`${i + 1}. ${LEVEL_WORD[levelOf(f)]}: ${one(f.title)} (${f.id})`);
      if (f.says) lines.push(`   ${one(f.says)}`);
      if (cat(f)) lines.push(`   Category: ${cat(f)}`);
      lines.push(...places(f, "   "), "");
    });
    const group = (title, list) => {
      if (!list.length) return;
      lines.push(title, "");
      for (const f of list) { lines.push(`- ${one(f.title)} (${f.id})${f.says ? `: ${one(f.says)}` : ""}`, ...places(f, "  ").slice(0, 1)); }
      lines.push("");
    };
    group("Credentials it reads", findings.filter((f) => f.kind === "credential"));
    group("What it can do on its own", findings.filter((f) => f.section === 6));
    group("What Inspect could not tell", findings.filter((f) => f.kind === "could-not-tell" || f.kind === "not-judged"));
    lines.push(`From Inspect ${one(d.inspector?.version)}'s inspection report. The whole report, with the facts each finding rests on, is inspection.json.`, "");
    return lines.join("\n");
  }
  async function doSave(d) {
    const name = `security-summary-${repoName(d).replace(/[^A-Za-z0-9._-]+/g, "-")}-${short(d.commit?.sha)}.txt`;
    const r = await ask("view/save-file", { name, media_type: "text/plain", text: summary(d) });
    toast(r && !r.error ? "The summary was handed over to save." : "The summary was not saved.");
  }

  // The height the frame needs: asked for when it changes, and after every
  // change of tab even when it has not. The promise settles once the host
  // has answered, so a finding is scrolled to only in a frame that fits.
  let lastHeight = 0; let queued = false; let forceNext = false; let settle = [];
  function resize(force = false) {
    return new Promise((done) => {
      if (!state.initialized) { done(); return; }
      if (force) forceNext = true;
      settle.push(done);
      if (queued) return;
      queued = true;
      requestAnimationFrame(() => {
        queued = false;
        const waiters = settle.splice(0);
        edges(app.querySelector(".tabs"));
        // The content's own height: the document's would never shrink below
        // the frame's, so a shorter tab would leave a gap.
        const h = Math.ceil(document.body.getBoundingClientRect().height);
        const send = h && (h !== lastHeight || forceNext);
        forceNext = false;
        if (!send) { for (const w of waiters) w(); return; }
        lastHeight = h;
        ask("view/resize", { height: h }).then(() => { for (const w of waiters) w(); });
      });
    });
  }
  if (typeof ResizeObserver === "function") new ResizeObserver(() => resize()).observe(document.body);
  window.addEventListener("error", (e) => fail(`Inspect's report view failed while drawing: ${e.message || "an error"}.`));
})();
</script>
</body>
</html>
