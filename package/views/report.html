<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data: blob:; media-src data: blob:; form-action 'none'; base-uri 'none'">
<title>Inspection report</title>
<!--
  Inspect's view of its report (Common Agent Specification 6.13.6; the
  Descriptor to user interface binding, Section 9). It draws one output, the
  inspection report, from the bytes the host hands it in view/data, and from
  nothing else: it loads nothing, opens nothing and acts on nothing. It asks
  the host for three things only: a height (view/resize), words copied to the
  clipboard (view/copy-text) and a file saved (view/save-file).

  One row of five tabs, with nothing above it: the host's own header names
  the repository.
  - Overview: the model's description of the agent, the anchor; how much is
    there as a row of tiles, each with its icon (its own skills, scripts and
    their lines, its own code, tests, systems required); what was inspected.
  - What it does: its jobs, each naming the skills that do it; what it takes
    and hands back; its skills, the most substantial first, each with its
    size and a bar for its lines; its own code; how it works. Read the skill
    opens the skill's own instructions in a dialog (0.4.0).
  - Systems it uses (0.4.0, was What it reaches): one card per outside
    system, with its icon, its name, required or optional as a word and a
    shape, and what the person supplies; then what it spends and what it can
    do on its own.
  - Could it move? (0.6.0): what it is built on; how tied it is, one row
    for each category it uses, with how open that is and, for an outside
    service, what it really needs and how it swaps; and for each other
    platform (three shown, Every platform for the rest) the work to move it
    and the platform's own rating and words for each category, from
    AgentMesh's agent platforms database. Facts by rule, never advice.
  - Risks: the risks by level, which are also the filter, the summary for
    security, and every risk highest first.
  - Tests and gaps (0.4.0): a document, every item's words shown, under
    What Inspect couldn't tell, Gaps in the tests and Tests; each test with
    how many tests, of what kind, and whether they run offline.
  A plugin or skills (0.5.0): what it is and the tools it installs into,
  under the description; tiles for its commands, sub-agents, hooks and MCP
  servers; the plugins of a repository that holds several, this one marked;
  its commands and sub-agents measured on What it does, with Read it; its MCP
  servers first on Systems it uses, each running on the machine or
  connecting out, with what the person supplies; its hooks first on Risks.
  While the job runs (0.4.0), one status under the tabs says which step it is
  on, and every field and list still to come shows a loading placeholder,
  never a blank value.
  Nothing on the page names a file, a line or an advisory id: this frame
  opens no link, so a reference would be dead text. Icons are drawn here, in
  the text's color: the brands' marks from Simple Icons (CC0), and a letter
  for any other system; nothing is fetched. Body text is 16px or larger and
  nothing is under 14px. A level, a need or a step is always a word and a
  shape, never a color alone.
-->
<style>
:root {
  --fb-background: #ffffff; --fb-surface: #f5f6f8; --fb-text: #1c1f24; --fb-muted: #5d6471;
  --fb-accent: #2f5bd3; --fb-border: #d8dce2; --fb-danger: #b3261e;
  --bg: var(--ca-color-background, var(--fb-background));
  --surface: var(--ca-color-surface, var(--fb-surface));
  --text: var(--ca-color-text, var(--fb-text));
  --muted: var(--ca-color-text-muted, var(--fb-muted));
  --accent: var(--ca-color-accent, var(--fb-accent));
  --border: var(--ca-color-border, var(--fb-border));
  --danger: var(--ca-color-danger, var(--fb-danger));
  --body: var(--ca-font-body, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif);
  --mono: var(--ca-font-mono, ui-monospace, "SFMono-Regular", "Cascadia Mono", Consolas, "Liberation Mono", monospace);
  /* Body text and row titles are 16px or larger, whatever the host hands;
     nothing on the page is drawn under 14px (0.875em). */
  --size: max(16px, var(--ca-font-size, 16px));
  --radius: var(--ca-radius, 8px);
  --s: var(--ca-space, 8px);
  --veil: rgba(16, 20, 24, 0.42);
  color-scheme: light;
}
:root[data-scheme="dark"] {
  --fb-background: #16181c; --fb-surface: #1f2228; --fb-text: #e7e9ec; --fb-muted: #a0a7b3;
  --fb-accent: #8fb0ff; --fb-border: #353a43; --fb-danger: #ff8f86;
  --veil: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-scheme="light"]) {
    --fb-background: #16181c; --fb-surface: #1f2228; --fb-text: #e7e9ec; --fb-muted: #a0a7b3;
    --fb-accent: #8fb0ff; --fb-border: #353a43; --fb-danger: #ff8f86;
    --veil: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); font-size: var(--size); line-height: 1.5; }
body { padding: 2px 2px calc(var(--s) * 2); position: relative; }
#app { min-width: 0; }
h2, h3, h4, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 0.875em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ico { display: inline-block; flex: none; vertical-align: middle; }
.btn { border: 1px solid var(--border); background: var(--surface); border-radius: calc(var(--radius) * 0.75); padding: calc(var(--s) * 0.7) calc(var(--s) * 1.4); min-height: 44px; font-size: 0.94em; font-weight: 600; display: inline-flex; gap: 0.5em; align-items: center; justify-self: start; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
/* A link-like button: copies a link, opens a skill, or brings a finding into sight. */
.copy-link, .ref { all: unset; box-sizing: border-box; cursor: pointer; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; overflow-wrap: anywhere; }
.copy-link { display: inline-flex; align-items: center; min-height: 44px; padding: 0 0.25em; font-size: 0.94em; vertical-align: middle; }
.ref { padding: 0.15em 0; }
.copy-link:focus-visible, .ref:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* The tabs: the first thing on the page. The open tab is underlined and
   bold; Risks names its highest level as a word and a shape. */
.tabs-wrap { border-bottom: 1px solid var(--border); min-width: 0; }
.tabs { display: flex; gap: calc(var(--s) * 0.25); overflow-x: auto; overflow-y: hidden; scrollbar-width: none; overscroll-behavior-x: contain; margin-bottom: -1px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs.more-right { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 3em), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 3em), transparent); }
.tabs.more-left { -webkit-mask-image: linear-gradient(to right, transparent, #000 3em); mask-image: linear-gradient(to right, transparent, #000 3em); }
.tabs.more-left.more-right { -webkit-mask-image: linear-gradient(to right, transparent, #000 3em, #000 calc(100% - 3em), transparent); mask-image: linear-gradient(to right, transparent, #000 3em, #000 calc(100% - 3em), transparent); }
.tab { all: unset; box-sizing: border-box; flex: none; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5em; min-height: 48px; padding: calc(var(--s) * 0.6) calc(var(--s) * 1.2); border-bottom: 3px solid transparent; color: var(--muted); white-space: nowrap; }
.tab:hover { color: var(--text); border-bottom-color: var(--border); }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; border-radius: 4px; }
.tab-name { font-size: 1em; font-weight: 600; white-space: nowrap; }
.tab[aria-selected="true"] .tab-name { font-weight: 700; }

/* While the job runs: one status, under the tabs, with the step it is on.
   The ring turns and the step's bar moves; with reduced motion both hold
   still, and the words and the filled bars carry it. */
.status { margin-top: calc(var(--s) * 1.5); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: calc(var(--s) * 0.5) calc(var(--s) * 1.25); align-items: center; padding: calc(var(--s) * 1.25) calc(var(--s) * 1.5); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.status.ended { grid-template-columns: minmax(0, 1fr); }
.status .now { font-weight: 600; min-width: 0; }
.status .now .step { font-weight: 500; color: var(--muted); }
.spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--border); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
.steps { grid-column: 2; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; margin: 0; padding: 0; list-style: none; }
.steps li { height: 6px; border-radius: 3px; border: 1px solid var(--muted); background: transparent; overflow: hidden; }
.steps li.done { background: var(--muted); border-color: var(--muted); }
.steps li.at { border-color: var(--accent); background: repeating-linear-gradient(90deg, var(--accent) 0 10px, transparent 10px 16px); background-size: 32px 100%; animation: slide 1.1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes slide { to { background-position: 32px 0; } }

/* What is still to come: a loading placeholder, never a blank. */
.sk { display: block; height: 0.9em; border-radius: 4px; background: linear-gradient(90deg, var(--border) 25%, color-mix(in srgb, var(--border) 40%, var(--bg)) 50%, var(--border) 75%); background-color: var(--border); background-size: 300% 100%; animation: shimmer 1.6s ease-in-out infinite; }
.sk.inline { display: inline-block; vertical-align: middle; width: 5em; }
.sk-lead { display: grid; gap: 0.6em; max-width: 64ch; margin-bottom: calc(var(--s) * 2.5); }
.sk-lead .sk { height: 1.1em; }
.sk-rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border); }
.sk-rows li { border-bottom: 1px solid var(--border); padding: calc(var(--s) * 1.4) calc(var(--s) * 0.5); display: grid; gap: 0.55em; }
.sk-rows.cards li { grid-template-columns: 36px minmax(0, 1fr); align-items: center; gap: 0.55em calc(var(--s) * 1.25); }
.sk-rows.cards .sk.box { height: 36px; border-radius: 8px; grid-row: span 2; }
.sk-doc { display: grid; gap: 0.6em; max-width: 68ch; margin-top: calc(var(--s) * 1.5); }
@keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
@media (prefers-reduced-motion: reduce) {
  .spin, .steps li.at, .sk { animation: none; }
  .spin { border-top-color: var(--accent); border-right-color: var(--accent); }
}

/* A tab's panel */
.panel { padding-top: calc(var(--s) * 2.5); }
.panel:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 4px; }
.panel > :first-child { margin-top: 0; }
.panel h2 { font-size: 1.1em; font-weight: 650; margin: calc(var(--s) * 3) 0 calc(var(--s) * 0.75); }
.panel h3 { font-size: 0.94em; font-weight: 650; color: var(--muted); letter-spacing: 0.01em; margin: calc(var(--s) * 2.5) 0 calc(var(--s) * 0.6); }
.panel > h2:first-child, .panel > h3:first-child { margin-top: 0; }
.quiet { color: var(--muted); padding: calc(var(--s) * 0.75) 0; }

/* Overview: the description, how much is there, what was inspected */
.lead { font-size: 1.25em; line-height: 1.45; max-width: 64ch; margin-bottom: calc(var(--s) * 2.5); }
.size-tiles { list-style: none; margin: 0 0 calc(var(--s) * 1); padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(10em, 1fr)); gap: calc(var(--s) * 1); }
.size-tiles li { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: calc(var(--s) * 1.25) calc(var(--s) * 1.5); display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "i v" "k k"; align-content: start; align-items: center; gap: calc(var(--s) * 0.4) calc(var(--s) * 0.75); min-width: 0; }
.size-tiles .ico { grid-area: i; color: var(--muted); }
.size-tiles .v { grid-area: v; font-size: 1.45em; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.size-tiles .k { grid-area: k; color: var(--muted); font-size: 0.94em; line-height: 1.35; }
/* 0.5.0: what a plugin is, under the description; the plugins of a repository that holds several */
.kind-line { margin: calc(var(--s) * -1.25) 0 calc(var(--s) * 2.25); font-size: 1em; }
.kind-word { font-weight: 650; }
.plugin-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border); max-width: 80ch; }
.plugin-list li { border-bottom: 1px solid var(--border); padding: calc(var(--s) * 1.1) calc(var(--s) * 0.5); display: grid; gap: 0.2em; }
.pl-name { font-weight: 650; display: flex; flex-wrap: wrap; gap: 0.3em 0.75em; align-items: center; overflow-wrap: anywhere; }
.pl-this { display: inline-flex; align-items: center; gap: 0.35em; font-size: 0.94em; font-weight: 600; color: var(--accent); }
.pl-what { color: var(--muted); font-size: 0.94em; overflow-wrap: anywhere; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: calc(var(--s) * 0.6) calc(var(--s) * 2.5); margin: 0; align-items: baseline; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

/* Levels and needs: a shape and a word, never a color alone */
.lv, .need { display: inline-flex; align-items: center; gap: 0.4em; font-size: 0.94em; font-weight: 600; white-space: nowrap; }
.lv svg, .need svg { flex: none; }
.lv.critical, .lv.high { color: var(--danger); }
.lv.medium { color: var(--text); }
.lv.low, .lv.none { color: var(--muted); }
.lv .word, .need .word { color: var(--text); }
.lv.unrated, .lv.unrated .word { color: var(--muted); font-weight: 500; }
.need.optional, .need.unclear, .need.none { color: var(--muted); }
.need.optional .word, .need.unclear .word, .need.none .word { color: var(--muted); font-weight: 500; }

/* Risks: the risks by level, each a filter; the action; then the rows */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5em, 1fr)); gap: calc(var(--s) * 0.75); }
.tile { all: unset; box-sizing: border-box; cursor: pointer; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: calc(var(--s) * 1) calc(var(--s) * 1.25); display: grid; gap: 0.15em; min-height: 44px; width: 100%; }
.tile:hover { border-color: var(--muted); }
.tile[aria-pressed="true"] { border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
.tile:disabled { cursor: default; }
.tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tile .n { font-size: 1.5em; font-weight: 650; line-height: 1.1; font-variant-numeric: tabular-nums; min-height: 1.1em; display: flex; align-items: center; }
.tile .w { display: flex; gap: 0.4em; align-items: center; font-size: 0.94em; }
.tile.zero .n, .tile.zero .w, .tile.zero .lv { color: var(--muted); font-weight: 500; }
.save { margin: calc(var(--s) * 1.5) 0 calc(var(--s) * 1.75); }

/* The rows: a title, and beside it what the list measures; the rest when opened */
.rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border); }
.row { border-bottom: 1px solid var(--border); }
.toggle { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: grid; grid-template-columns: 1em minmax(0, 1fr); gap: calc(var(--s) * 0.75); align-items: baseline; min-height: 48px; padding: calc(var(--s) * 0.8) calc(var(--s) * 0.5); border-radius: 4px; }
.rows.rated .toggle { grid-template-columns: 1em 7em minmax(0, 1fr); }
.rows.measured .toggle { grid-template-columns: 1em minmax(0, 1fr) auto; }
.toggle:hover { background: var(--surface); }
.toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.toggle .chev { color: var(--muted); }
.toggle .tt { min-width: 0; overflow-wrap: anywhere; display: grid; gap: 0.15em; }
.toggle .under { color: var(--muted); font-size: 0.94em; }
.measure { display: grid; justify-items: end; gap: 0.35em; color: var(--muted); font-size: 0.94em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.bar { display: block; width: 8em; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
.bar .fill { display: block; height: 100%; background: var(--muted); }
.detail { padding: 0 calc(var(--s) * 1) calc(var(--s) * 1.75) calc(var(--s) * 0.5 + 1em + var(--s) * 0.75); display: grid; gap: calc(var(--s) * 1.1); max-width: 80ch; }
.rows.rated .detail { padding-left: calc(var(--s) * 0.5 + 1em + 7em + var(--s) * 1.5); }
.detail dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: calc(var(--s) * 0.6) calc(var(--s) * 2); margin: 0; align-items: baseline; }
.detail dt { color: var(--muted); font-size: 0.94em; }
.detail dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.advisories { margin: 0; padding: 0; list-style: none; display: grid; gap: calc(var(--s) * 0.6); }

/* Systems it uses: one card per system, its icon, its name and what it is
   for, what the person supplies, and required or optional (0.4.0) */
.rows.systems .toggle { grid-template-columns: 1em 40px minmax(0, 1fr) auto; align-items: center; padding-top: calc(var(--s) * 1.1); padding-bottom: calc(var(--s) * 1.1); }
.sys-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); display: grid; place-items: center; color: var(--text); font-weight: 700; font-size: 1.05em; line-height: 1; }
.sys-icon svg { width: 22px; height: 22px; }
.rows.systems .name { font-weight: 650; }
.supply { display: flex; gap: 0.45em; align-items: flex-start; color: var(--text); font-size: 0.94em; }
.supply .ico { color: var(--muted); margin-top: 0.2em; }
.supply.nothing { color: var(--muted); }
.rows.systems .detail { padding-left: calc(var(--s) * 0.5 + 1em + 40px + var(--s) * 1.5); }

/* Tests and gaps: a document to read, every item's words shown (0.4.0) */
.doc { max-width: 68ch; }
.doc h3 { font-size: 1.1em; color: var(--text); font-weight: 700; letter-spacing: 0; margin: calc(var(--s) * 3.5) 0 calc(var(--s) * 1); padding-bottom: calc(var(--s) * 0.6); border-bottom: 1px solid var(--border); }
.doc h3:first-child { margin-top: 0; }
.doc-item { margin: 0 0 calc(var(--s) * 2); }
.doc-item h4 { font-size: 1em; font-weight: 650; margin: 0 0 calc(var(--s) * 0.3); }
.doc-item p { line-height: 1.6; }
.doc-item .meta { color: var(--muted); font-size: 0.94em; margin-bottom: calc(var(--s) * 0.3); font-variant-numeric: tabular-nums; }
.doc-item .lv { margin-bottom: calc(var(--s) * 0.3); }

/* The dialog: a skill's own instructions, over the page, where the person
   is (0.4.0). The frame is as tall as its content, so the dialog is placed
   in the part of the frame the person can see, never centered in the frame. */
.layer { position: absolute; left: 0; top: 0; width: 100%; z-index: 10; }
.veil { position: absolute; inset: 0; background: var(--veil); }
.dialog { position: absolute; left: 50%; transform: translateX(-50%); width: min(760px, calc(100% - 32px)); display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.28); overflow: hidden; }
.dlg-head { flex: none; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: calc(var(--s) * 0.5) calc(var(--s) * 1.5); align-items: start; padding: calc(var(--s) * 1.75) calc(var(--s) * 2) calc(var(--s) * 1.25); border-bottom: 1px solid var(--border); }
.dlg-head h2 { font-size: 1.15em; font-weight: 700; margin: 0.35em 0 0; overflow-wrap: anywhere; }
.dlg-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: calc(var(--s) * 1.75) calc(var(--s) * 2) calc(var(--s) * 2.25); display: grid; gap: calc(var(--s) * 1.1); align-content: start; }
.dlg-body:focus-visible { outline-offset: -3px; }
.md { display: grid; gap: calc(var(--s) * 0.9); overflow-wrap: anywhere; }
.md .md-h { margin: calc(var(--s) * 1) 0 0; color: var(--text); font-size: 1em; font-weight: 650; letter-spacing: 0; }
.md h3.md-h { font-size: 1.1em; }
.md ul, .md ol { margin: 0; padding-left: 1.4em; display: grid; gap: 0.3em; }
.md pre { margin: 0; padding: calc(var(--s) * 1.1); background: var(--surface); border-radius: calc(var(--radius) * 0.6); overflow-x: auto; font-family: var(--mono); font-size: 0.875em; line-height: 1.45; white-space: pre; }
.cut { color: var(--muted); }

/* Could it move? (0.6.0): what it is built on, how tied it is in each
   category it uses, and what moving it elsewhere would take. Its shapes
   are in the text's color: a fact about a platform, never a warning. */
.move-lead { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: calc(var(--s) * 0.25) calc(var(--s) * 1.5); align-items: center; margin-bottom: calc(var(--s) * 1); max-width: 80ch; }
.move-lead .sys-icon { width: 44px; height: 44px; }
.move-lead .sys-icon svg { width: 24px; height: 24px; }
.move-lead .k { display: block; color: var(--muted); font-size: 0.94em; }
.move-lead .v { font-size: 1.25em; font-weight: 700; line-height: 1.3; }
.move-lead .under { color: var(--muted); }
.ties { font-size: 1.05em; line-height: 1.5; max-width: 72ch; margin: calc(var(--s) * 1.25) 0 0; }
.lv.fact, .lv.fact .word { color: var(--text); }
.lv.fact.dim, .lv.fact.dim .word { color: var(--muted); font-weight: 500; }
.tie-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border); }
.tie-list > li { border-bottom: 1px solid var(--border); padding: calc(var(--s) * 1.25) calc(var(--s) * 0.5); display: grid; grid-template-columns: 10em minmax(0, 1fr); gap: calc(var(--s) * 0.3) calc(var(--s) * 1.5); align-items: baseline; }
.tie-body { display: grid; gap: calc(var(--s) * 0.4); min-width: 0; max-width: 76ch; }
.tie-name { font-weight: 650; justify-self: start; }
.tie-what, .cell-what, .tie-also { color: var(--muted); overflow-wrap: anywhere; }
.tie-need { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 0.15em calc(var(--s) * 1.25); }
.tie-need .k, .work .k { color: var(--muted); }
.tie-swap { font-weight: 600; }
.not-used { color: var(--muted); margin-top: calc(var(--s) * 1.5); max-width: 76ch; }
.dests { display: grid; gap: calc(var(--s) * 1.5); }
.dest { border: 1px solid var(--border); border-radius: var(--radius); padding: calc(var(--s) * 1.75) calc(var(--s) * 2); display: grid; gap: calc(var(--s) * 1.5); min-width: 0; }
.dest-head { display: flex; gap: calc(var(--s) * 1.25); align-items: center; flex-wrap: wrap; }
.dest-head h3 { margin: 0; color: var(--text); font-size: 1.1em; font-weight: 700; letter-spacing: 0; }
.dest-head .also { color: var(--muted); font-size: 0.94em; }
.work { display: grid; gap: calc(var(--s) * 0.9); padding-top: calc(var(--s) * 1.25); border-top: 1px solid var(--border); min-width: 0; }
.work h4 { margin: 0; font-size: 1em; font-weight: 650; display: flex; flex-wrap: wrap; gap: 0.2em 0.75em; align-items: baseline; }
.work h4 .n { color: var(--muted); font-weight: 500; font-size: 0.94em; font-variant-numeric: tabular-nums; }
.work > .cell-what { max-width: 76ch; }
.cells { list-style: none; margin: 0; padding: 0; display: grid; gap: calc(var(--s) * 1.1); }
.cells li { display: grid; grid-template-columns: 10em minmax(0, 1fr); gap: 0.15em calc(var(--s) * 1.5); align-items: baseline; }
.cells .cell-body { display: grid; gap: 0.15em; min-width: 0; max-width: 76ch; }
.cells .ref { justify-self: start; }
.more { margin: calc(var(--s) * 1.5) 0 0; }
.db-line { margin-top: calc(var(--s) * 2.5); color: var(--muted); font-size: 0.875em; }
.dlg-body .lv { margin-top: calc(var(--s) * 0.25); }
@media (max-width: 640px) {
  .tie-list > li, .cells li { grid-template-columns: minmax(0, 1fr); }
  .dest { padding: calc(var(--s) * 1.5) calc(var(--s) * 1.25); }
}

.toast { position: fixed; right: calc(var(--s) * 2); bottom: calc(var(--s) * 2); background: var(--text); color: var(--bg); border-radius: var(--radius); padding: calc(var(--s) * 0.75) calc(var(--s) * 1.5); font-size: 0.94em; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 20; }
.toast.on { opacity: 1; }

@media (max-width: 640px) {
  .lead { font-size: 1.15em; }
  .tiles, .size-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rows.rated .toggle { grid-template-columns: 1em minmax(0, 1fr); grid-template-areas: "c lv" "c t"; }
  .rows.rated .toggle > .chev { grid-area: c; }
  .rows.rated .toggle > .lv { grid-area: lv; }
  .rows.rated .toggle > .tt { grid-area: t; }
  .rows.measured .toggle { grid-template-columns: 1em minmax(0, 1fr); }
  .rows.measured .toggle > .measure { grid-column: 2; justify-items: start; }
  .rows.systems .toggle { grid-template-columns: 1em 40px minmax(0, 1fr); align-items: start; }
  .rows.systems .toggle > .need { grid-column: 3; }
  .detail, .rows.rated .detail, .rows.systems .detail { padding-left: calc(var(--s) * 0.5 + 1em + var(--s) * 0.75); }
  .facts, .detail dl { grid-template-columns: 1fr; gap: 0; }
  .facts dd, .detail dd { margin-bottom: calc(var(--s) * 0.75); }
  .tab { padding: calc(var(--s) * 0.6) calc(var(--s) * 0.9); }
  .dialog { width: calc(100% - 12px); }
  .dlg-head, .dlg-body { padding-left: calc(var(--s) * 1.5); padding-right: calc(var(--s) * 1.5); }
}

<body>
<main id="app"></main>
<div id="layer"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
(() => {
  // The bridge (DESCRIPTOR-UI Section 9.4): JSON-RPC 2.0 messages with the
  // host, the page above this frame. Only the methods below, and only the
  // requests this view declares.
  const REQUESTS = ["resize", "copy-text", "save-file"];
  const TOKENS = ["--ca-color-background", "--ca-color-surface", "--ca-color-text", "--ca-color-text-muted", "--ca-color-accent", "--ca-color-border", "--ca-color-danger", "--ca-font-body", "--ca-font-mono", "--ca-font-size", "--ca-radius", "--ca-space"];
  const KIND = "application/vnd.agentmesh.inspection-report+json";
  const LEVELS = ["critical", "high", "medium", "low", "none"];
  const LEVEL_WORD = { critical: "Critical", high: "High", medium: "Medium", low: "Low", none: "No risk" };
  // A finding the report gives no level, in a list where the others have
  // one: said in words and with a shape of its own.
  const NOT_RATED = "Not rated";
  // The five tabs, each holding whole sections in the report's own order.
  const TABS = [
    { id: "overview", name: "Overview", sections: [1, 2] },
    { id: "does", name: "What it does", sections: [3, 4] },
    { id: "systems", name: "Systems it uses", sections: [5, 6] },
    // 0.6.0: from the report's portability member, not from its sections.
    { id: "move", name: "Could it move?", sections: [] },
    { id: "risks", name: "Risks", sections: [7] },
    { id: "tests", name: "Tests and gaps", sections: [8] },
  ];
  const RISKS = 7;
  // Section 7's findings that say what it needs to run safely, not a risk.
  const SAFELY = ["least-access", "approval"];
  // How a job's findings arrive: the scripts' findings all at once (section
  // 2 among them), then the model's judgments of sections 3 to 5 in one
  // call, of 6 to 8 in the next, and section 1 last.
  const CALLS = [[3, 4, 5], [6, 7, 8]];
  // The steps of a job, and the words for each, from the stage its working
  // copy names (scripts/inspect-a-repository.mjs and judge.mjs).
  const STEP_COUNT = 5;
  const STAGES = [
    [/^reading github/i, 1, "Reading the repository"],
    [/^unpacked/i, 2, "Reading the code"],
    [/osv about|asking osv/i, 2, "Checking its dependencies for known security flaws"],
    [/^osv /i, 2, "Writing what the code shows"],
    [/sections 3, 4 and 5/i, 3, "Judging what it does and the systems it uses"],
    [/sections 6, 7 and 8/i, 4, "Judging its risks and its tests"],
    [/^writing section 1/i, 5, "Writing the overview"],
    [/^done/i, 5, "Finishing the report"],
  ];

  const root = document.documentElement;
  const app = document.getElementById("app");
  const layer = document.getElementById("layer");
  const state = { initialized: false, ready: false, locale: undefined, width: null, doc: null, params: null, tab: TABS[0].id, level: "all", open: new Set(), viewer: null, viewerFrom: null, place: null, allPlatforms: false };
  let seq = 0;
  const waiting = new Map();

  const post = (msg) => window.parent.postMessage({ jsonrpc: "2.0", ...msg }, "*");
  const notify = (method, params) => post({ method, ...(params ? { params } : {}) });
  function ask(method, params) {
    const id = `inspect-view-${++seq}`;
    post({ id, method, params });
    return new Promise((resolve) => {
      const timer = setTimeout(() => { waiting.delete(id); resolve({ error: { message: "no answer" } }); }, 20000);
      waiting.set(id, (m) => { clearTimeout(timer); resolve(m); });
    });
  }
  const answer = (id, result) => post({ id, result });
  const fail = (message) => notify("view/report-failure", { message });

  window.addEventListener("message", (e) => {
    if (e.source !== window.parent) return;
    const m = e.data;
    if (!m || typeof m !== "object" || m.jsonrpc !== "2.0") return;
    if (typeof m.method !== "string") {
      if (m.id !== undefined && waiting.has(m.id)) { const done = waiting.get(m.id); waiting.delete(m.id); done(m); }
      return;
    }
    const p = m.params && typeof m.params === "object" ? m.params : {};
    if (m.method === "view/initialize") {
      host(p, true);
      state.initialized = true;
      answer(m.id, { requests: REQUESTS });
      draw();
      if (!state.ready) { state.ready = true; notify("view/ready"); }
    } else if (m.method === "view/data") {
      take(p);
    } else if (m.method === "view/host-changed") {
      host(p, false);
      draw();
    } else if (m.method === "view/teardown") {
      answer(m.id, {});
    } else if (m.id !== undefined) {
      post({ id: m.id, error: { code: -32601, message: "This view does not take that method." } });
    }
  });

  // The host's tokens, color scheme, locale and width.
  function host(p, first) {
    const scheme = p.color_scheme === "dark" || p.color_scheme === "light" ? p.color_scheme : null;
    const schemeChanged = scheme && root.dataset.scheme !== scheme;
    if (scheme) root.dataset.scheme = scheme;
    if (typeof p.locale === "string" && p.locale) state.locale = p.locale;
    if (Number(p.width) > 0) state.width = Number(p.width);
    if (p.tokens && typeof p.tokens === "object") {
      for (const name of TOKENS) root.style.removeProperty(name);
      for (const name of TOKENS) {
        const v = p.tokens[name];
        if (typeof v === "string" && v.length <= 300 && !/url\s*\(|image-set|expression\s*\(|@import|[;{}<>\\]/i.test(v)) root.style.setProperty(name, v);
      }
    } else if (!first && schemeChanged) {
      for (const name of TOKENS) root.style.removeProperty(name);
    }
  }

  // view/data: the output's bytes, its lifecycle and the job's state. A new
  // report never moves the person to another tab.
  function take(p) {
    let text = typeof p.text === "string" ? p.text : null;
    if (text === null && typeof p.base64 === "string") {
      try { text = new TextDecoder("utf-8", { fatal: true }).decode(Uint8Array.from(atob(p.base64), (c) => c.charCodeAt(0))); } catch { text = null; }
    }
    const kind = String(p.media_type ?? "").split(";")[0].trim().toLowerCase();
    let doc = null; let why = "";
    if (kind && kind !== KIND && !kind.endsWith("+json") && kind !== "application/json") why = `it was handed ${kind}, not the inspection report`;
    else if (text === null) why = "it was handed no bytes it could read as text";
    else {
      try { doc = JSON.parse(text); } catch { why = "the report it was handed does not parse as JSON"; }
      if (doc && (doc.format !== "inspection-report-v1" || !Array.isArray(doc.findings) || !doc.repository || !doc.commit)) { doc = null; why = "what it was handed is not an inspection report"; }
    }
    state.params = p;
    if (doc) {
      // 0.6.0: the reading is made before the first finding and changes only
      // when the model answers; a working copy short of room leaves it out,
      // or its words, so the one drawn before is kept.
      const prev = state.doc?.portability;
      if (prev && doc.partial && !doc.portability) doc.portability = prev;
      else if (prev && doc.portability?.words_left_out) fillWords(doc.portability, prev);
      state.doc = doc; draw(); return;
    }
    if (state.doc && running(p, state.doc)) { draw(); return; }
    fail(`Inspect's report view cannot draw this: ${why}.`);
  }

  // ── Drawing ──
  // Elements that take focus carry a data-k key, so a redraw (new findings
  // every few seconds while the job runs) puts focus back where it was.
  let keyed = new Map();
  const el = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs ?? {})) {
      if (v === undefined || v === null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : String(v));
    }
    if (attrs?.["data-k"]) keyed.set(String(attrs["data-k"]), n);
    for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) n.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    return n;
  };
  // Markup drawn from this file's own constants only, never from the report.
  function svgOf(inner, { size = 16, box = 16, cls = "ico", stroke = false } = {}) {
    const t = document.createElement("template");
    const paint = stroke ? ' fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"' : ' fill="currentColor"';
    t.innerHTML = `<svg class="${cls}" width="${Number(size)}" height="${Number(size)}" viewBox="0 0 ${Number(box)} ${Number(box)}"${paint} aria-hidden="true" focusable="false">${inner}</svg>`;
    return t.content.firstChild;
  }
  // Each level's shape, drawn here and nowhere else, so a level never rests
  // on its color: critical an octagon, high a triangle, medium a diamond, low
  // a ring, no risk a bar, not rated an open square. A system's need has its
  // own: required a filled square, optional a half-filled circle, not clear

  const SHAPES = {
    required: '<rect x="2" y="2" width="12" height="12" rx="2" fill="currentColor"/>',
    optional: '<circle cx="8" cy="8" r="5.8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 2.2a5.8 5.8 0 0 1 0 11.6z" fill="currentColor"/>',

    unrated: '<rect x="2.6" y="2.6" width="10.8" height="10.8" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/>',

  const ICONS = {
    skills: '<rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/>',

    systems: '<path d="M9 2.8v4.4M15 2.8v4.4M5.8 7.2h12.4v3.6a6.2 6.2 0 0 1-12.4 0z"/><path d="M12 17v4.2"/>',
    key: '<circle cx="7.6" cy="15.6" r="4.2"/><path d="m10.6 12.6 8.6-8.6M16.4 6.8l2.8 2.8M13.8 9.4l2 2"/>',

    // 0.5.0: what a plugin adds to a person's tools.

    agents: '<circle cx="9" cy="8.5" r="3.2"/><path d="M3.6 19.6c.6-3.3 2.8-5.1 5.4-5.1s4.8 1.8 5.4 5.1"/><circle cx="16.6" cy="9.6" r="2.6"/><path d="M15.8 14.7c2.4.1 4.1 1.8 4.7 4.9"/>',

  };

  // The marks of the systems an agent most often uses, from Simple Icons
  // (CC0, 16.37.0), each drawn in the text's color. A system none matches

  // take their marks out, so they are drawn as letters too.
  const BRANDS = {
    anthropic: "M17.3041 3.541h-3.6718l6.696 16.918H24Zm-10.6082 0L0 20.459h3.7442l1.3693-3.5527h7.0052l1.3693 3.5528h3.7442L10.5363 3.5409Zm-.3712 10.2232 2.2914-5.9456 2.2914 5.9456Z",

      : [b.frameworks?.length ? andList(b.frameworks.map(one)) : null, one(b.language) || null, (b.platforms ?? []).length > 1 ? `also ${andList(b.platforms.slice(1).map((x) => `${one(x.vendor)}'s platform`))}` : null].filter(Boolean).join(" · ");
    out.push(el("div", { class: "move-lead" },
      systemIcon(plugin ? (plugin.tools?.[0] ?? name) : one(main?.vendor) || name),
      el("div", {}, el("span", { class: "k", text: plugin ? "Runs in" : "Built on" }), el("p", { class: "v", text: name }), under ? el("p", { class: "under", text: under }) : null)));
    // What ties it to its vendor: each row the database rates the vendor's
    // own or partly open, said as the ratings say it and no more.
    // A row whose use is kept in the agent's own memory ties it to nothing.
    const ties = (p.uses ?? []).filter((r) => !r.plugin_part && r.swap !== "in-process" && (r.level === "proprietary" || r.level === "mixed"));
    if (!plugin) out.push(el("p", { class: "ties", text: ties.length ? `Tied to its vendor in ${titles(ties.map((r) => r.title.toLowerCase()))}.` : (p.uses ?? []).length ? "Everything it uses of its platform is open source or an open standard." : "It uses none of the features the database lists." }));

    out.push(el("h2", { text: "How tied it is" }));
    if ((p.uses ?? []).length) {
      out.push(el("ul", { class: "tie-list" }, p.uses.map((r) => {
        const src = r.sources.find((s) => s.level === r.level) ?? r.sources[0];
        const others = r.sources.filter((s) => s !== src);
        // The cell's sentence that names what the code uses, else its first.
        const words = one(src?.lead) || one(src?.what);
        const needs = r.needs
          ? el("div", { class: "tie-need" }, el("span", { class: "k", text: "Needs" }), el("span", { text: cap(r.needs) }), r.choices ? el("span", { class: "k", text: "Also offers" }) : null, r.choices ? el("span", { text: cap(r.choices) }) : null)
          : r.outside && pending.has(3) ? el("div", { class: "tie-need" }, el("span", { class: "k", text: "Needs" }), el("span", {}, skInline(), el("span", { class: "sr", text: SOON }))) : null;
        return el("li", {},
          factBadge(r.plugin_part ? ["high", "Its tool's own"] : OPEN[r.level] ?? OPEN.unknown),
          el("div", { class: "tie-body" },
            el("button", { class: "ref tie-name", type: "button", "data-k": `tie:${r.category}`, onclick: (e) => openViewer(tieCell(p, r), e.currentTarget) }, r.title),
            words ? el("p", { class: "tie-what" }, prose(firstOf(words))) : sk("80%"),
            others.length ? el("p", { class: "tie-also" }, `Also ${andList(others.map((s) => (s.standard ? STANDARD_WORDS[s.standard] ?? s.standard : sourceName(s))))}.`) : null,
            needs,
            r.outside ? el("p", { class: "tie-swap", text: swapLine(r) }) : r.swap === "in-process" ? el("p", { class: "tie-swap", text: "Kept in its own memory: no service to swap" }) : null));
      })));
    } else out.push(el("p", { class: "quiet", text: "It uses none of the features the database lists." }));
    const notUsed = (plugin ? p.not_applicable : p.not_used) ?? [];
    if (notUsed.length) out.push(el("p", { class: "not-used", text: `${plugin ? `Doesn't apply to ${plugin.kind === "skills" ? "skills" : "a plugin"}` : "Not used"}: ${andList(notUsed.map((k) => CAT[k] ?? k))}.` }));

    out.push(el("h2", { text: "Moving it" }));
    const list = (p.destinations ?? []).filter((x) => state.allPlatforms || x.shown);
    out.push(el("div", { class: "dests" }, list.map((x) => drawDest(p, x, outside))));
    const rest = (p.destinations ?? []).filter((x) => !x.shown).length;
    if (rest) out.push(el("p", { class: "more" }, el("button", { class: "btn", type: "button", "aria-expanded": state.allPlatforms ? "true" : "false", "data-k": "every-platform", onclick: () => { state.allPlatforms = !state.allPlatforms; draw(); resize(true); } }, state.allPlatforms ? "Fewer platforms" : "Every platform")));
    out.push(dbLine(p));
    return out;
  }
  // One destination: the two kinds of work kept apart. Its outside services
  // are swapped one by one, each for the destination's own; its own code is
  // re-hosted on the destination's deployment, where what it uses comes
  // along or is replaced. Under each, the destination's rating and words
  // for every category it uses, what it would lose first.
  function drawDest(p, x, outside) {
    const byRating = (a, c) => OFFER_ORDER.indexOf(a.rating) - OFFER_ORDER.indexOf(c.rating);
    const swapping = new Set(outside.map((r) => r.category));
    // Its deployment is the re-host line itself, said once.
    const cells = [...(x.cells ?? [])].filter((c) => pluginOf(state.doc) || c.category !== "deployment").sort(byRating);
    const list = (cs) => el("ul", { class: "cells" }, cs.map((c) => el("li", {},
      factBadge(OFFER[c.rating] ?? OFFER.unknown, c.rating === "native" || c.rating === "standard"),
      el("div", { class: "cell-body" },
        el("button", { class: "ref", type: "button", "data-k": `cell:${x.platform}:${c.category}`, onclick: (e) => openViewer(destCell(p, x, c), e.currentTarget) }, c.title),
        one(c.what) ? el("p", { class: "cell-what" }, prose(firstOf(c.what))) : sk("80%")))));
    const swaps = cells.filter((c) => swapping.has(c.category));
    const rest = cells.filter((c) => !swapping.has(c.category));
    const out = [el("div", { class: "dest-head" }, systemIcon(one(x.vendor) || one(x.name)), el("h3", { text: one(x.name) }), x.also_used ? el("span", { class: "also", text: "Its code uses it too" }) : null)];
    if (swaps.length) out.push(el("div", { class: "work" }, el("h4", { text: "Swap part by part" }), list(swaps)));
    if (!pluginOf(state.doc)) {
      const rt = x.runtime;
      const size = rt && rt.own_files !== null && Number.isFinite(Number(rt.own_files)) ? `${num(rt.own_files)} ${Number(rt.own_files) === 1 ? "file" : "files"}, ${num(Number(rt.own_lines) || 0)} lines` : null;
      const how = one(rt?.deployment?.what);
      out.push(el("div", { class: "work" }, el("h4", {}, "Re-host its own code", size ? el("span", { class: "n", text: size }) : null), how ? el("p", { class: "cell-what" }, prose(firstOf(how))) : sk("70%"), rest.length ? list(rest) : null));
    } else if (rest.length) out.push(el("div", { class: "work" }, list(rest)));
    if (!cells.length && pluginOf(state.doc)) out.push(el("p", { class: "quiet", text: "Nothing it uses is rated here." }));
    return el("section", { class: "dest", "aria-label": one(x.name) }, out);
  }
  // The dialog's content for one row, and for one destination's cell: the
  // database's whole words, how open the feature is and why.
  function tieCell(p, r) {
    return { key: `tie:${r.category}`, title: r.title, words: r.sources.map((s) => one(s.what).length).join(","), parts: () => [
      ...r.sources.flatMap((s) => [el("h3", { class: "md-h", text: sourceName(s) }), factBadge(OPEN[s.level] ?? OPEN.unknown), one(s.what) ? el("p", {}, prose(one(s.what))) : sk("90%"), one(s.note) ? el("p", { class: "muted" }, prose(one(s.note))) : null]),
      dbLine(p)] };
  }
  function destCell(p, x, c) {
    return { key: `cell:${x.platform}:${c.category}`, title: `${c.title}: ${one(x.name)}`, words: String(one(c.what).length), parts: () => [factBadge(OFFER[c.rating] ?? OFFER.unknown), one(c.what) ? el("p", {}, prose(one(c.what))) : sk("90%"), dbLine(p)] };
  }


  function drawPanel(d, t, pending) {
    if (t.id === "overview") return drawOverview(d, pending);
    if (t.id === "does") return drawDoes(d, pending);
    if (t.id === "systems") return drawSystems(d, pending);
    if (t.id === "move") return drawMove(d, pending);
    if (t.id === "risks") return drawRisks(d, pending);
    return drawTests(d, pending);
  }

  function focusKey() {
    for (let n = document.activeElement; n && n !== document.body && typeof n.getAttribute === "function"; n = n.parentNode) {
      const k = n.getAttribute("data-k");
      if (k) return k;
    }
    return null;
  }

  function draw() {
    const d = state.doc;
    if (!state.initialized && !d) return;
    const keep = window.scrollY;
    const focused = focusKey();
    const stripLeft = Number(app.querySelector(".tabs")?.scrollLeft) || 0;
    const kept = new Map([...keyed].filter(([k]) => k.startsWith("viewer-")));
    keyed = new Map(kept);
    app.replaceChildren();
    const p = state.params ?? {};
    const pending = d ? pendingOf(d, p) : new Set([1, 2, 3, 4, 5, 6, 7, 8, "move"]);
    app.append(drawTabs(d, pending));
    const status = drawStatus(d, p);
    if (status) app.append(status);
    app.append(...TABS.map((t) => {
      const on = state.tab === t.id;
      const body = !on ? null : d ? drawPanel(d, t, pending) : [skRows(3)];
      return el("div", { class: "panel", role: "tabpanel", id: `panel-${t.id}`, "aria-labelledby": `tab-${t.id}`, tabindex: "0", hidden: !on, "data-k": `panel:${t.id}` }, body);
    }));
    drawLayer(d);
    const strip = app.querySelector(".tabs");
    if (strip) { strip.scrollLeft = stripLeft; edges(strip); }
    if (focused && keyed.has(focused)) keyed.get(focused).focus({ preventScroll: true });
    window.scrollTo(0, keep);
    resize();
  }

  // A finding brought into sight: the tab that holds it, then the finding
  // itself, in sight and open, once the frame has been made to fit the tab.
  async function reveal(id) {
    const d = state.doc;
    const f = d?.findings.find((x) => x.id === id);
    if (!f) return;
    if (f.section === RISKS && !keeps(f, state.level)) state.level = "all";
    state.open.add(id);
    const fitted = setTab(tabOf(f.section).id);
    await Promise.race([fitted, new Promise((r) => setTimeout(r, 600))]);
    const row = document.getElementById(`f-${id}`);
    if (row) { row.scrollIntoView({ block: "center" }); row.querySelector(".toggle")?.focus({ preventScroll: true }); }
  }

  // The summary for security, as plain text: the risks highest first, the
  // credentials it reads, what it can do on its own and what Inspect could
  // not tell, each with its file and line and the address of that line.
  function summary(d) {
    const c = counts(d); const p = state.params ?? {};
    const findings = d.findings.filter((f) => f.section !== 1);
    const risks = findings.filter((f) => levelOf(f) && levelOf(f) !== "none").sort((a, b) => rank(a) - rank(b));
    const places = (f, indent) => (f.evidence ?? []).slice(0, 3).map((e) => { const a = address(d, e.file, e.line); return `${indent}${one(e.file)} line ${e.line}${a ? `: ${a}` : ""}`; });
    const cat = (f) => (f.categories ?? []).map((x) => one(x.name && x.name !== x.id ? `${x.id} ${x.name}` : x.id)).join("; ");
    const stop = ended(d, p);
    const where = stop ? `${stop} This summary is of the findings it made.` : running(p, d) ? `Still running (${stepOf(d).words.toLowerCase()}); this summary is of the findings so far.` : null;
    const lines = [
      `Security summary: ${repoName(d)} at commit ${short(d.commit?.sha)}`, "",
      `Inspect read the code of ${repoName(d)} at commit ${d.commit?.sha} without running any of it. It gives no verdict on ${pluginOf(d) ? "allowing it" : "bringing the agent in"}.`,
      `Repository: ${one(d.repository?.url)}`,
      // 0.5.0: what a plugin is, and which one of several this is.
      ...(pluginOf(d) ? [`What it is: ${whatItIs(pluginOf(d))}${pluginOf(d).also_for?.length ? `, also packaged for ${andList(pluginOf(d).also_for)}` : ""}${pluginOf(d).plugins?.length ? `; this is the plugin ${one(pluginOf(d).name)}, one of ${pluginOf(d).plugins.length} in the repository` : ""}. It runs inside the person's own tool, on their machine, with their files and their credentials.`] : []),
      ...(where ? [where] : []), "",
      "Risks by level", "",
      `${c.critical ?? 0} critical, ${c.high ?? 0} high, ${c.medium ?? 0} medium and ${c.low ?? 0} low.`, "",
      "Risks, highest first", "",
    ];
    if (!risks.length) lines.push("No risk was rated.", "");
    risks.forEach((f, i) => {
      lines.push(`${i + 1}. ${LEVEL_WORD[levelOf(f)]}: ${one(f.title)} (${f.id})`);
      if (f.says) lines.push(`   ${one(f.says)}`);
      for (const a of Array.isArray(f.detail?.hook?.also) ? f.detail.hook.also : []) lines.push(`   Also in its code: ${one(a.title)}. ${one(a.says)}`);
      if (cat(f)) lines.push(`   Category: ${cat(f)}`);
      lines.push(...places(f, "   "), "");
    });
    const group = (title, list) => {
      if (!list.length) return;
      lines.push(title, "");
      for (const f of list) { lines.push(`- ${one(f.title)} (${f.id})${f.says ? `: ${one(f.says)}` : ""}`, ...places(f, "  ").slice(0, 1)); }
      lines.push("");
    };
    group("MCP servers it brings", findings.filter((f) => f.kind === "mcp-server"));
    group("Credentials it reads", findings.filter((f) => f.kind === "credential"));
    group("What it can do on its own", findings.filter((f) => f.section === 6));
    group("What Inspect could not tell", findings.filter((f) => f.kind === "could-not-tell" || f.kind === "not-judged"));
    lines.push(`From Inspect ${one(d.inspector?.version)}'s inspection report. The whole report, with the facts each finding rests on, is inspection.json.`, "");
    return lines.join("\n");
  }
  async function doSave(d) {
    const name = `security-summary-${repoName(d).replace(/[^A-Za-z0-9._-]+/g, "-")}-${short(d.commit?.sha)}.txt`;
    const r = await ask("view/save-file", { name, media_type: "text/plain", text: summary(d) });
    if (r && !r.error && r.result?.saved) toast("Saved.");
  }

  // The height the frame needs: asked for when it changes, and after every
  // change of tab even when it has not. The promise settles once the host
  // has answered, so a finding is scrolled to only in a frame that fits.
  let lastHeight = 0; let queued = false; let forceNext = false; let settle = [];
  function resize(force = false) {
    return new Promise((done) => {
      if (!state.initialized) { done(); return; }
      if (force) forceNext = true;
      settle.push(done);
      if (queued) return;
      queued = true;
      requestAnimationFrame(() => {
        queued = false;
        const waiters = settle.splice(0);
        edges(app.querySelector(".tabs"));
        // The content's own height: the document's would never shrink below
        // the frame's, so a shorter tab would leave a gap. An open dialog
        // that reaches lower than the page makes room for itself.
        const dlg = layer.querySelector?.(".dialog");
        const foot = dlg ? (Number(dlg.offsetTop) || 0) + (Number(dlg.offsetHeight) || 0) + 16 : 0;
        const h = Math.max(Math.ceil(document.body.getBoundingClientRect().height), foot);
        const send = h && (h !== lastHeight || forceNext);
        forceNext = false;
        if (!send) { for (const w of waiters) w(); return; }
        lastHeight = h;

    });
  }

  // Escape closes the dialog.
  if (typeof document.addEventListener === "function") document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.viewer) { e.preventDefault(); closeViewer(); } });
  window.addEventListener("error", (e) => fail(`Inspect's report view failed while drawing: ${e.message || "an error"}.`));
})();
