<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data: blob:; media-src data: blob:; form-action 'none'; base-uri 'none'">
<title>Inspection report</title>
<!--
  Inspect's view of its report (Common Agent Specification 6.13.6; the
  Descriptor to user interface binding, Section 9). It draws one output, the
  inspection report, from the bytes the host hands it in view/data, and from
  nothing else: it loads nothing, opens nothing and acts on nothing. It asks
  the host for three things only: a height (view/resize), words copied to the
  clipboard (view/copy-text) and a file saved (view/save-file).

  Since 0.2.4 the whole view is one row of six tabs, with nothing above it:
  the host's own header names the repository. Overview (the risks by level,
  the top judgments and what was inspected), What it does (sections 3 and
  4), What it reaches (5 and 6), Risks (7), Tests and gaps (8) and About
  Inspect (Inspect's own words, from the Descriptor the host hands it). A
  row shows its title, and on Risks its level; opening it shows the
  finding's words, where it is in the code, its category and Copy. While the
  job runs, the counts fill in and one line under the tabs says what Inspect
  is doing. Colors and fonts come from the host's --ca-* tokens, each with a
  fallback for light and for dark. A level is always a word and a shape,
  never a color alone.
-->
<style>
:root {
  --fb-background: #ffffff; --fb-surface: #f5f6f8; --fb-text: #1c1f24; --fb-muted: #5d6471;
  --fb-accent: #2f5bd3; --fb-border: #d8dce2; --fb-danger: #b3261e;
  --bg: var(--ca-color-background, var(--fb-background));
  --surface: var(--ca-color-surface, var(--fb-surface));
  --text: var(--ca-color-text, var(--fb-text));
  --muted: var(--ca-color-text-muted, var(--fb-muted));
  --accent: var(--ca-color-accent, var(--fb-accent));
  --border: var(--ca-color-border, var(--fb-border));
  --danger: var(--ca-color-danger, var(--fb-danger));
  --body: var(--ca-font-body, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif);
  --mono: var(--ca-font-mono, ui-monospace, "SFMono-Regular", "Cascadia Mono", Consolas, "Liberation Mono", monospace);
  --size: var(--ca-font-size, 15px);
  --radius: var(--ca-radius, 8px);
  --s: var(--ca-space, 8px);
  color-scheme: light;
}
:root[data-scheme="dark"] {
  --fb-background: #16181c; --fb-surface: #1f2228; --fb-text: #e7e9ec; --fb-muted: #a0a7b3;
  --fb-accent: #8fb0ff; --fb-border: #353a43; --fb-danger: #ff8f86;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-scheme="light"]) {
    --fb-background: #16181c; --fb-surface: #1f2228; --fb-text: #e7e9ec; --fb-muted: #a0a7b3;
    --fb-accent: #8fb0ff; --fb-border: #353a43; --fb-danger: #ff8f86;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); font-size: var(--size); line-height: 1.5; }
body { padding: 2px 2px calc(var(--s) * 2); }
#app { min-width: 0; }
h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 0.84em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.btn { border: 1px solid var(--border); background: var(--surface); border-radius: calc(var(--radius) * 0.75); padding: calc(var(--s) * 0.7) calc(var(--s) * 1.3); min-height: 44px; font-size: 0.92em; font-weight: 600; display: inline-flex; gap: 0.5em; align-items: center; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }

/* The tabs: the first thing on the page. The open tab is underlined and
   bold; a count sits small beside each name, and Risks names its highest
   level as a word and a shape. */
.tabs-wrap { border-bottom: 1px solid var(--border); min-width: 0; }
.tabs { display: flex; gap: calc(var(--s) * 0.25); overflow-x: auto; overflow-y: hidden; scrollbar-width: none; overscroll-behavior-x: contain; margin-bottom: -1px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs.more-right { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 3em), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 3em), transparent); }
.tabs.more-left { -webkit-mask-image: linear-gradient(to right, transparent, #000 3em); mask-image: linear-gradient(to right, transparent, #000 3em); }
.tabs.more-left.more-right { -webkit-mask-image: linear-gradient(to right, transparent, #000 3em, #000 calc(100% - 3em), transparent); mask-image: linear-gradient(to right, transparent, #000 3em, #000 calc(100% - 3em), transparent); }
.tab { all: unset; box-sizing: border-box; flex: none; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5em; min-height: 44px; padding: calc(var(--s) * 0.6) calc(var(--s) * 1.1); border-bottom: 3px solid transparent; color: var(--muted); white-space: nowrap; }
.tab:hover { color: var(--text); border-bottom-color: var(--border); }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; border-radius: 4px; }
.tab-name { font-size: 0.94em; font-weight: 600; white-space: nowrap; }
.tab[aria-selected="true"] .tab-name { font-weight: 700; }
.tab-n { font-size: 0.82em; font-variant-numeric: tabular-nums; color: var(--muted); }
.tab .lv { font-size: 0.8em; }
.now { margin-top: calc(var(--s) * 1); font-size: 0.9em; color: var(--muted); display: flex; gap: 0.55em; align-items: baseline; }
.pulse { display: inline-block; width: 0.55em; height: 0.55em; border-radius: 50%; background: var(--accent); flex: none; transform: translateY(-0.05em); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.3; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

/* A tab's panel */
.panel { padding-top: calc(var(--s) * 2); }
.panel:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 4px; }
.panel > :first-child { margin-top: 0; }
.panel h2 { font-size: 1.02em; font-weight: 650; margin: calc(var(--s) * 2.5) 0 calc(var(--s) * 0.75); }
.panel > h2:first-child { margin-top: 0; }
.quiet { color: var(--muted); font-size: 0.92em; padding: calc(var(--s) * 0.75) 0; }

/* Overview: the risks by level, the top judgments, what was inspected */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: calc(var(--s) * 0.75); }
.tile { all: unset; box-sizing: border-box; cursor: pointer; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: calc(var(--s) * 1) calc(var(--s) * 1.25); display: grid; gap: 0.15em; min-height: 44px; width: 100%; }
.tile:hover { border-color: var(--muted); }
.tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tile .n { font-size: 1.5em; font-weight: 650; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .w { display: flex; gap: 0.4em; align-items: center; font-size: 0.88em; }
.tile.zero .n, .tile.zero .w, .tile.zero .lv { color: var(--muted); font-weight: 500; }
.tiles > div { display: grid; min-width: 0; }
.matters { list-style: none; margin: calc(var(--s) * 2) 0 0; padding: 0; display: grid; gap: calc(var(--s) * 1.5); }
.matters li { display: grid; grid-template-columns: 6.4em minmax(0, 1fr); gap: calc(var(--s) * 1); }
.matters .t { font-weight: 620; }
.matters .says { margin-top: 0.15em; }
.matters .see { margin-top: 0.3em; font-size: 0.88em; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: calc(var(--s) * 0.5) calc(var(--s) * 2); margin: 0; font-size: 0.94em; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.save { margin-top: calc(var(--s) * 2.5); }

/* Levels: a shape and a word */
.lv { display: inline-flex; align-items: center; gap: 0.4em; font-size: 0.86em; font-weight: 600; white-space: nowrap; }
.lv svg { flex: none; }
.lv.critical, .lv.high { color: var(--danger); }
.lv.medium { color: var(--text); }
.lv.low, .lv.none { color: var(--muted); }
.lv .word { color: var(--text); }
.lv.unrated, .lv.unrated .word { color: var(--muted); font-weight: 500; }

/* The level filter, on Risks */
.chips { display: flex; flex-wrap: wrap; gap: calc(var(--s) * 0.5); align-items: center; margin-bottom: calc(var(--s) * 1.25); }
.chip { border: 1px solid var(--border); background: var(--bg); border-radius: 999px; padding: 0.3em 0.85em; min-height: 36px; font-size: 0.86em; display: inline-flex; gap: 0.4em; align-items: center; }
.chip[aria-pressed="true"] { border-color: var(--text); background: var(--surface); font-weight: 650; box-shadow: inset 0 0 0 1px var(--text); }
.chip .c { color: var(--muted); font-variant-numeric: tabular-nums; }

/* The rows: the title, and on Risks its level; the rest when opened */
.rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border); }
.row { border-bottom: 1px solid var(--border); }
.toggle { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: grid; grid-template-columns: 1em minmax(0, 1fr); gap: calc(var(--s) * 0.6); align-items: baseline; min-height: 44px; padding: calc(var(--s) * 0.75) calc(var(--s) * 0.5); border-radius: 4px; }
.rows.rated .toggle { grid-template-columns: 1em 6.4em minmax(0, 1fr); }
.toggle:hover { background: var(--surface); }
.toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.toggle .chev { color: var(--muted); }
.toggle .tt { min-width: 0; overflow-wrap: anywhere; }
.detail { padding: 0 calc(var(--s) * 1) calc(var(--s) * 1.5) calc(var(--s) * 0.5 + 1em + var(--s) * 0.6); display: grid; gap: calc(var(--s) * 1); }
.detail > p { font-size: 0.96em; }
.rows.rated .detail { padding-left: calc(var(--s) * 0.5 + 1em + 6.4em + var(--s) * 1.2); }
.detail dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: calc(var(--s) * 0.5) calc(var(--s) * 1.5); margin: 0; font-size: 0.9em; }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.detail ul { margin: 0; padding: 0; list-style: none; display: grid; gap: calc(var(--s) * 0.35); }
.copy { justify-self: start; border: 1px solid var(--border); background: var(--bg); border-radius: calc(var(--radius) * 0.6); padding: 0.3em 0.9em; min-height: 36px; font-size: 0.88em; }
.copy:hover { border-color: var(--muted); }

/* About Inspect */
.about { display: grid; gap: calc(var(--s) * 0.5); max-width: 68ch; }
.about h2 { margin: calc(var(--s) * 1.25) 0 0; }
.about > h2:first-child { margin-top: 0; }
.about ul { margin: 0; padding-left: 1.2em; display: grid; gap: calc(var(--s) * 0.35); }

.waiting { padding: calc(var(--s) * 4) 0; color: var(--muted); }
.toast { position: fixed; right: calc(var(--s) * 2); bottom: calc(var(--s) * 2); background: var(--text); color: var(--bg); border-radius: var(--radius); padding: calc(var(--s) * 0.75) calc(var(--s) * 1.5); font-size: 0.88em; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
.toast.on { opacity: 1; }

@media (max-width: 640px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rows.rated .toggle { grid-template-columns: 1em minmax(0, 1fr); grid-template-areas: "c lv" "c t"; }
  .rows.rated .toggle > .chev { grid-area: c; }
  .rows.rated .toggle > .lv { grid-area: lv; }
  .rows.rated .toggle > .tt { grid-area: t; }
  .detail, .rows.rated .detail { padding-left: calc(var(--s) * 0.5 + 1em + var(--s) * 0.6); }
  .matters li { grid-template-columns: 1fr; gap: calc(var(--s) * 0.35); }
  .facts { grid-template-columns: 1fr; gap: 0; }
  .facts dd { margin-bottom: calc(var(--s) * 0.75); }
  .tab { padding: calc(var(--s) * 0.6) calc(var(--s) * 0.9); }
}
</style>
</head>
<body>
<main id="app"><p class="waiting">Waiting for the report.</p></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
(() => {
  // The bridge (DESCRIPTOR-UI Section 9.4): JSON-RPC 2.0 messages with the
  // host, the page above this frame. Only the methods below, and only the
  // requests this view declares.
  const REQUESTS = ["resize", "copy-text", "save-file"];
  const TOKENS = ["--ca-color-background", "--ca-color-surface", "--ca-color-text", "--ca-color-text-muted", "--ca-color-accent", "--ca-color-border", "--ca-color-danger", "--ca-font-body", "--ca-font-mono", "--ca-font-size", "--ca-radius", "--ca-space"];
  const KIND = "application/vnd.agentmesh.inspection-report+json";
  const LEVELS = ["critical", "high", "medium", "low", "none"];
  const LEVEL_WORD = { critical: "Critical", high: "High", medium: "Medium", low: "Low", none: "No risk" };
  // A finding the report gives no level, in a list where the others have
  // one: said in words and with a shape of its own.
  const NOT_RATED = "Not rated";
  const SYSTEM_WORD = { "code-host": "GitHub's records", "vulnerability-database": "OSV, the vulnerability database", "text-reasoning": "the model" };
  // The six tabs. The first five hold whole sections, in the report's own
  // order; About Inspect holds Inspect's own words.
  const TABS = [
    { id: "overview", name: "Overview", sections: [1, 2] },
    { id: "does", name: "What it does", sections: [3, 4] },
    { id: "reaches", name: "What it reaches", sections: [5, 6] },
    { id: "risks", name: "Risks", sections: [7] },
    { id: "tests", name: "Tests and gaps", sections: [8] },
    { id: "about", name: "About Inspect", sections: [] },
  ];
  const RISKS = 7;
  // Section 7's findings that say what it needs to run safely, not a risk.
  const SAFELY = ["least-access", "approval"];
  // How a job's findings arrive: the scripts' findings all at once (section
  // 2 among them), then the model's judgments of sections 3 to 5 in one
  // call, of 6 to 8 in the next, and section 1 last.
  const CALLS = [[3, 4, 5], [6, 7, 8]];
  // What Inspect is doing, in a few words, from the stage its working copy
  // names (scripts/inspect-a-repository.mjs and judge.mjs).
  const STAGES = [
    [/^reading github/i, "Reading the repository"],
    [/^unpacked/i, "Reading the code"],
    [/osv about|asking osv/i, "Checking the dependencies for known vulnerabilities"],
    [/^osv /i, "Writing the findings"],
    [/sections 3, 4 and 5/i, "Judging what it does, how it works and what it connects to"],
    [/sections 6, 7 and 8/i, "Judging what it can do on its own, its risks and its tests"],
    [/^writing section 1/i, "Writing the overview"],
    [/^done/i, "Finishing the report"],
  ];
  // Inspect's own words, for About Inspect when the host hands no Descriptor.
  const OWN = {
    summary: "Reads an outside agent's code on GitHub at one commit, without running any of it, and reports what it does and how safe it is.",
    how: "Scripts collect the facts; a model writes only the judgments, and each judgment cites the facts it rests on.",
    not: ["Running, installing, building or testing the repository's code", "Giving a verdict on whether to bring the agent in, or judging how it fits a plan or a catalog role"],
  };

  const root = document.documentElement;
  const app = document.getElementById("app");
  const state = { initialized: false, ready: false, locale: undefined, doc: null, params: null, tab: TABS[0].id, level: "all", open: new Set() };
  let seq = 0;
  const waiting = new Map();

  const post = (msg) => window.parent.postMessage({ jsonrpc: "2.0", ...msg }, "*");
  const notify = (method, params) => post({ method, ...(params ? { params } : {}) });
  function ask(method, params) {
    const id = `inspect-view-${++seq}`;
    post({ id, method, params });
    return new Promise((resolve) => {
      const timer = setTimeout(() => { waiting.delete(id); resolve({ error: { message: "no answer" } }); }, 20000);
      waiting.set(id, (m) => { clearTimeout(timer); resolve(m); });
    });
  }
  const answer = (id, result) => post({ id, result });
  const fail = (message) => notify("view/report-failure", { message });

  window.addEventListener("message", (e) => {
    if (e.source !== window.parent) return;
    const m = e.data;
    if (!m || typeof m !== "object" || m.jsonrpc !== "2.0") return;
    if (typeof m.method !== "string") {
      if (m.id !== undefined && waiting.has(m.id)) { const done = waiting.get(m.id); waiting.delete(m.id); done(m); }
      return;
    }
    const p = m.params && typeof m.params === "object" ? m.params : {};
    if (m.method === "view/initialize") {
      host(p, true);
      state.initialized = true;
      answer(m.id, { requests: REQUESTS });
      draw();
      if (!state.ready) { state.ready = true; notify("view/ready"); }
    } else if (m.method === "view/data") {
      take(p);
    } else if (m.method === "view/host-changed") {
      host(p, false);
      draw();
    } else if (m.method === "view/teardown") {
      answer(m.id, {});
    } else if (m.id !== undefined) {
      post({ id: m.id, error: { code: -32601, message: "This view does not take that method." } });
    }
  });

  // The host's tokens, color scheme, locale and width.
  function host(p, first) {
    const scheme = p.color_scheme === "dark" || p.color_scheme === "light" ? p.color_scheme : null;
    const schemeChanged = scheme && root.dataset.scheme !== scheme;
    if (scheme) root.dataset.scheme = scheme;
    if (typeof p.locale === "string" && p.locale) state.locale = p.locale;
    if (p.tokens && typeof p.tokens === "object") {
      for (const name of TOKENS) root.style.removeProperty(name);
      for (const name of TOKENS) {
        const v = p.tokens[name];
        if (typeof v === "string" && v.length <= 300 && !/url\s*\(|image-set|expression\s*\(|@import|[;{}<>\\]/i.test(v)) root.style.setProperty(name, v);
      }
    } else if (!first && schemeChanged) {
      for (const name of TOKENS) root.style.removeProperty(name);
    }
  }

  // view/data: the output's bytes, its lifecycle, the job's state and the
  // Descriptor. A new report never moves the person to another tab.
  function take(p) {
    let text = typeof p.text === "string" ? p.text : null;
    if (text === null && typeof p.base64 === "string") {
      try { text = new TextDecoder("utf-8", { fatal: true }).decode(Uint8Array.from(atob(p.base64), (c) => c.charCodeAt(0))); } catch { text = null; }
    }
    const kind = String(p.media_type ?? "").split(";")[0].trim().toLowerCase();
    let doc = null; let why = "";
    if (kind && kind !== KIND && !kind.endsWith("+json") && kind !== "application/json") why = `it was handed ${kind}, not the inspection report`;
    else if (text === null) why = "it was handed no bytes it could read as text";
    else {
      try { doc = JSON.parse(text); } catch { why = "the report it was handed does not parse as JSON"; }
      if (doc && (doc.format !== "inspection-report-v1" || !Array.isArray(doc.findings) || !doc.repository || !doc.commit)) { doc = null; why = "what it was handed is not an inspection report"; }
    }
    state.params = p;
    if (doc) { state.doc = doc; draw(); return; }
    if (state.doc && running(p, state.doc)) { draw(); return; }
    fail(`Inspect's report view cannot draw this: ${why}.`);
  }

  // ── Drawing ──
  // Elements that take focus carry a data-k key, so a redraw (new findings
  // every few seconds while the job runs) puts focus back where it was.
  let keyed = new Map();
  const el = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs ?? {})) {
      if (v === undefined || v === null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : String(v));
    }
    if (attrs?.["data-k"]) keyed.set(String(attrs["data-k"]), n);
    for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) n.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    return n;
  };
  // Each level's shape, drawn here and nowhere else, so a level never rests
  // on its color: critical an octagon, high a triangle, medium a diamond, low
  // a ring, no risk a bar, not rated an open square.
  const SHAPES = {
    critical: '<polygon points="5,1 11,1 15,5 15,11 11,15 5,15 1,11 1,5" fill="currentColor"/>',
    high: '<polygon points="8,1.5 15.2,14.5 0.8,14.5" fill="currentColor"/>',
    medium: '<polygon points="8,1 15,8 8,15 1,8" fill="currentColor"/>',
    low: '<circle cx="8" cy="8" r="5.6" fill="none" stroke="currentColor" stroke-width="2.4"/>',
    none: '<rect x="2" y="6.8" width="12" height="2.4" fill="currentColor"/>',
    unrated: '<rect x="2.6" y="2.6" width="10.8" height="10.8" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/>',
  };
  function shape(level, size = 13) {
    const t = document.createElement("template");
    t.innerHTML = `<svg width="${Number(size)}" height="${Number(size)}" viewBox="0 0 16 16" aria-hidden="true" focusable="false">${SHAPES[level] ?? SHAPES.unrated}</svg>`;
    return t.content.firstChild;
  }
  const levelOf = (f) => (LEVELS.includes(f?.level) ? f.level : null);
  function badge(f) {
    const l = levelOf(f);
    if (!l) return el("span", { class: "lv unrated" }, shape("unrated"), el("span", { class: "word", text: NOT_RATED }));
    return el("span", { class: `lv ${l}` }, shape(l), el("span", { class: "word", text: LEVEL_WORD[l] }));
  }
  const rank = (f) => { const l = levelOf(f); return l ? LEVELS.indexOf(l) : LEVELS.length; };

    app.append(...TABS.map((t) => {
      const on = state.tab === t.id;
      return el("div", { class: "panel", role: "tabpanel", id: `panel-${t.id}`, "aria-labelledby": `tab-${t.id}`, tabindex: "0", hidden: !on, "data-k": `panel:${t.id}` }, on ? drawPanel(d, p, t, pending) : null);
    }));
    const strip = app.querySelector(".tabs");
    if (strip) { strip.scrollLeft = stripLeft; edges(strip); }
    if (focused && keyed.has(focused)) keyed.get(focused).focus({ preventScroll: true });
    window.scrollTo(0, keep);
    resize();
  }

  // "See it in Risks": the tab that holds the finding, then the finding
  // itself, in sight and open, once the frame has been made to fit the tab.
  async function reveal(id) {
    const d = state.doc;
    const f = d?.findings.find((x) => x.id === id);
    if (!f) return;
    if (f.section === RISKS && !keeps(f, state.level)) state.level = "all";
    state.open.add(id);
    const fitted = setTab(tabOf(f.section).id);
    await Promise.race([fitted, new Promise((r) => setTimeout(r, 600))]);
    const row = document.getElementById(`f-${id}`);
    if (row) { row.scrollIntoView({ block: "center" }); row.querySelector(".toggle")?.focus({ preventScroll: true }); }
  }

  // The summary for security, as plain text: the risks highest first, the
  // credentials it reads, what it can do on its own and what Inspect could
  // not tell, each with its file and line and the address of that line.
  function summary(d) {
    const c = counts(d); const p = state.params ?? {};
    const findings = d.findings.filter((f) => f.section !== 1);
    const risks = findings.filter((f) => levelOf(f) && levelOf(f) !== "none").sort((a, b) => rank(a) - rank(b));
    const places = (f, indent) => (f.evidence ?? []).slice(0, 3).map((e) => { const a = address(d, e.file, e.line); return `${indent}${one(e.file)} line ${e.line}${a ? `: ${a}` : ""}`; });
    const cat = (f) => (f.categories ?? []).map((x) => one(x.name && x.name !== x.id ? `${x.id} ${x.name}` : x.id)).join("; ");
    const stop = ended(d, p);
    const where = stop ? `${stop} This summary is of the findings it made.` : running(p, d) ? `Still running (${stageWords(d).toLowerCase()}); this summary is of the findings so far.` : null;
    const lines = [
      `Security summary: ${repoName(d)} at commit ${short(d.commit?.sha)}`, "",
      `Inspect read the code of ${repoName(d)} at commit ${d.commit?.sha} without running any of it. It gives no verdict on bringing the agent in.`,
      `Repository: ${one(d.repository?.url)}`, ...(where ? [where] : []), "",
      "Risks by level", "",
      `${c.critical ?? 0} critical, ${c.high ?? 0} high, ${c.medium ?? 0} medium and ${c.low ?? 0} low.`, "",
      "Risks, highest first", "",
    ];
    if (!risks.length) lines.push("No risk was rated.", "");
    risks.forEach((f, i) => {
      lines.push(`${i + 1}. ${LEVEL_WORD[levelOf(f)]}: ${one(f.title)} (${f.id})`);
      if (f.says) lines.push(`   ${one(f.says)}`);
      if (cat(f)) lines.push(`   Category: ${cat(f)}`);
      lines.push(...places(f, "   "), "");
    });
    const group = (title, list) => {
      if (!list.length) return;
      lines.push(title, "");
      for (const f of list) { lines.push(`- ${one(f.title)} (${f.id})${f.says ? `: ${one(f.says)}` : ""}`, ...places(f, "  ").slice(0, 1)); }
      lines.push("");
    };
    group("Credentials it reads", findings.filter((f) => f.kind === "credential"));
    group("What it can do on its own", findings.filter((f) => f.section === 6));
    group("What Inspect could not tell", findings.filter((f) => f.kind === "could-not-tell" || f.kind === "not-judged"));
    lines.push(`From Inspect ${one(d.inspector?.version)}'s inspection report. The whole report, with the facts each finding rests on, is inspection.json.`, "");
    return lines.join("\n");
  }
  async function doSave(d) {
    const name = `security-summary-${repoName(d).replace(/[^A-Za-z0-9._-]+/g, "-")}-${short(d.commit?.sha)}.txt`;
    const r = await ask("view/save-file", { name, media_type: "text/plain", text: summary(d) });
    if (r && !r.error && r.result?.saved) toast("Saved.");
  }

  // The height the frame needs: asked for when it changes, and after every
  // change of tab even when it has not. The promise settles once the host
  // has answered, so a finding is scrolled to only in a frame that fits.
  let lastHeight = 0; let queued = false; let forceNext = false; let settle = [];
  function resize(force = false) {
    return new Promise((done) => {
      if (!state.initialized) { done(); return; }
      if (force) forceNext = true;
      settle.push(done);
      if (queued) return;
      queued = true;
      requestAnimationFrame(() => {
        queued = false;
        const waiters = settle.splice(0);
        edges(app.querySelector(".tabs"));
        // The content's own height: the document's would never shrink below
        // the frame's, so a shorter tab would leave a gap.
        const h = Math.ceil(document.body.getBoundingClientRect().height);
        const send = h && (h !== lastHeight || forceNext);
        forceNext = false;
        if (!send) { for (const w of waiters) w(); return; }
        lastHeight = h;
        ask("view/resize", { height: h }).then(() => { for (const w of waiters) w(); });
      });
    });
  }
  if (typeof ResizeObserver === "function") new ResizeObserver(() => resize()).observe(document.body);
  window.addEventListener("error", (e) => fail(`Inspect's report view failed while drawing: ${e.message || "an error"}.`));
})();
</script>
</body>
</html>
